<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style id="page-style">@page{size:A4 portrait;margin:12mm}</style>
<style>
:root{
  --blue:#3D7FBB; --blue-d:#2F6A9F; --teal:#3FA88F; --teal-d:#2A8069; --navy:#1F5F8B;
  --bg:#F7FAFC; --card:#FFFFFF; --text:#1E2B37; --muted:#4D5D6B; --line:#D7E3ED;
  --soft-blue:#EAF2FA; --soft-teal:#E6F5F0; --soft-amber:#FFF6E3; --amber:#8A5300;
  --soft-red:#FCEDEA; --red:#A63A2B; --radius:16px; --shadow:0 2px 12px rgba(31,95,139,.08);
}
*{box-sizing:border-box}
html{font-size:19px}
@media (min-width:1500px){html{font-size:22px}}  /* السبورة الذكية والشاشات الكبيرة */
body{margin:0;font-family:'Tajawal','Cairo','Sakkal Majalla',Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.85}
h1,h2,h3,h4{color:var(--navy);font-weight:800;line-height:1.45;margin:0 0 .5em}
h1{font-size:1.65rem} h2{font-size:1.35rem} h3{font-size:1.12rem}
p{margin:.3em 0 .8em}
a{color:var(--blue-d);font-weight:700}
img{max-width:100%}
.skip{position:absolute;right:-9999px}
.skip:focus{right:1rem;top:1rem;background:#fff;padding:.5rem 1rem;z-index:99;border-radius:8px}
:focus-visible{outline:3px solid #E8A400;outline-offset:3px}
main:focus,main:focus-visible{outline:none}

/* الشريط العلوي */
.topbar{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
.topbar-in{max-width:1080px;margin:auto;padding:.55rem 1rem;display:flex;align-items:center;gap:.8rem;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:.6rem;text-decoration:none;color:var(--navy);font-weight:800;font-size:1.15rem;line-height:1.3}
.brand-logo{width:46px;height:46px;border-radius:13px;background:var(--blue);color:#fff;display:grid;place-items:center;font-size:1.35rem}
.brand small{display:block;font-size:.72rem;color:var(--muted);font-weight:500}
.main-nav{margin-inline-start:auto;display:flex;gap:.3rem;flex-wrap:wrap}
.main-nav a{text-decoration:none;color:var(--navy);padding:.4rem .9rem;border-radius:999px;font-weight:700;min-height:46px;display:inline-flex;align-items:center;gap:.35rem}
.main-nav a[aria-current="page"]{background:var(--soft-blue)}
@media (max-width:640px){.topbar{position:static}}
.hello{width:100%;font-weight:700;color:var(--teal-d);font-size:.9rem}
@media (min-width:820px){.hello{width:auto}}

main{max-width:1080px;margin:auto;padding:1.2rem 1rem 5rem;outline:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:1.3rem 1.4rem;box-shadow:var(--shadow);margin-bottom:1.2rem}
.kicker{color:var(--teal-d);font-weight:800;margin:0 0 .2rem;font-size:.9rem}
.muted{color:var(--muted)}
.center{text-align:center}

/* الأزرار */
.btn{font:inherit;font-weight:700;border:2px solid transparent;border-radius:12px;padding:.55rem 1.3rem;min-height:52px;cursor:pointer;background:var(--blue-d);color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:.5rem;text-decoration:none;line-height:1.4}
.btn:hover{filter:brightness(1.07)}
.btn.secondary{background:#fff;color:var(--navy);border-color:var(--blue)}
.btn.success{background:var(--teal-d)}
.btn.ghost{background:transparent;color:var(--navy);border:2px dashed #B9CCDD}
.btn.danger{background:var(--red)}
.btn.sm{min-height:44px;padding:.35rem 1rem;font-size:.92rem}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.row{display:flex;gap:.7rem;flex-wrap:wrap;align-items:center}
.spread{justify-content:space-between}
.end{justify-content:flex-end}
.nav-row{display:flex;gap:.7rem;justify-content:space-between;flex-wrap:wrap;margin-top:1rem}

input[type=text],input[type=password],textarea{font:inherit;width:100%;padding:.65rem 1rem;border:2px solid var(--line);border-radius:12px;background:#fff;color:var(--text)}
input[type=text]:focus,input[type=password]:focus,textarea:focus{border-color:var(--blue);outline:none;box-shadow:0 0 0 3px rgba(61,127,187,.2)}
textarea{min-height:110px;resize:vertical}
.lbl{font-weight:800;color:var(--navy);display:block;margin:.4rem 0 .3rem}

.progress{height:16px;background:var(--soft-blue);border-radius:999px;overflow:hidden}
.progress>span{display:block;height:100%;background:var(--teal);border-radius:999px;transition:width .6s}
.pill{display:inline-flex;align-items:center;gap:.3rem;padding:.2rem .8rem;border-radius:999px;font-weight:700;font-size:.88rem}
.st-new{background:#EEF1F4;color:#4A5763}
.st-prog{background:var(--soft-amber);color:var(--amber)}
.st-done{background:var(--soft-teal);color:var(--teal-d)}
.st-soon{background:#F1EEF7;color:#5B4A7A}

/* الرئيسية */
.hero{display:grid;grid-template-columns:1fr auto;gap:1rem;align-items:center;background:linear-gradient(135deg,#fff 55%,var(--soft-blue))}
.hero-art{font-size:5rem;line-height:1}
@media (max-width:640px){.hero{grid-template-columns:1fr}.hero-art{display:none}}
.flow{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(4,1fr);gap:1.4rem}
.flow li{position:relative;background:var(--soft-blue);border-radius:14px;padding:1rem .8rem;text-align:center}
.flow li:nth-child(even){background:var(--soft-teal)}
.flow .ic{font-size:2.2rem;display:block}
.flow b{display:block;color:var(--navy);font-size:1.1rem}
.flow small{color:var(--muted);font-size:.85rem;display:block;line-height:1.6}
.flow li:not(:last-child)::after{content:"←";position:absolute;left:-1.25rem;top:50%;transform:translateY(-50%);color:var(--blue);font-weight:800;font-size:1.3rem}
@media (max-width:760px){.flow{grid-template-columns:1fr 1fr}.flow li::after{display:none}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:1rem}
.lesson-card{display:flex;flex-direction:column;gap:.5rem;margin:0}
.lesson-card .ic{font-size:2.4rem}
.lesson-card.soon{opacity:.75}
.lesson-card .grow{flex:1}

/* صفحة الدرس */
.lesson-head{display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.lesson-head .ic{font-size:2.6rem}
.stepper{display:flex;gap:.4rem;overflow-x:auto;padding:.3rem .1rem .6rem;margin:0 0 1rem;list-style:none}
.stepper a{display:flex;flex-direction:column;align-items:center;min-width:92px;padding:.45rem .5rem;border-radius:12px;text-decoration:none;color:var(--navy);background:#fff;border:2px solid var(--line);font-size:.85rem;line-height:1.4;position:relative}
.stepper a .ic{font-size:1.4rem}
.stepper a[aria-current="step"]{border-color:var(--blue);background:var(--soft-blue)}
.stepper a.done::after{content:"✓";position:absolute;top:-8px;left:-6px;background:var(--teal-d);color:#fff;border-radius:50%;width:22px;height:22px;font-size:.75rem;display:grid;place-items:center}
.goals{padding-inline-start:1.2rem}
.goals li{margin-bottom:.3rem}
.video{position:relative;padding-top:56.25%;border-radius:14px;overflow:hidden;background:#0d2236}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.ph{border:2px dashed #A9C3DA;border-radius:14px;background:repeating-linear-gradient(45deg,var(--soft-blue),var(--soft-blue) 12px,#F3F8FC 12px,#F3F8FC 24px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:1rem;color:var(--navy);min-height:150px}
.ph .ic{font-size:2.6rem}
.ph small{color:var(--muted);font-size:.8rem}
.points{list-style:none;padding:0;margin:0;display:grid;gap:.7rem}
.points li{border-inline-start:5px solid var(--teal);background:#FBFDFE;border-radius:10px;padding:.6rem 1rem;transition:background .4s}
.points li b{color:var(--navy)}
.flash{animation:flash 2.4s ease 2;background:#FFF3C9!important}
@keyframes flash{50%{background:#FFE58A}}
.steps{list-style:none;padding:0;margin:0;counter-reset:s;display:grid;gap:1rem}
.steps li{counter-increment:s;display:grid;grid-template-columns:1fr 1fr;gap:1rem;align-items:center;background:#FBFDFE;border:1px solid var(--line);border-radius:14px;padding:.8rem}
.steps li .txt::before{content:counter(s);display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--blue-d);color:#fff;font-weight:800;margin-inline-end:.5rem}
.steps img{border-radius:10px;border:1px solid var(--line)}
@media (max-width:640px){.steps li{grid-template-columns:1fr}}
.back-quiz{position:fixed;bottom:1rem;left:1rem;z-index:25;box-shadow:0 6px 20px rgba(0,0,0,.18)}

/* الأنشطة */
.pool{display:flex;flex-wrap:wrap;gap:.6rem;min-height:64px;padding:.8rem;border:2px dashed var(--line);border-radius:14px;margin:.6rem 0 1rem;background:#FBFDFE}
.chip{font:inherit;font-weight:800;unicode-bidi:plaintext;background:#fff;color:var(--navy);border:2px solid var(--blue);border-radius:12px;padding:.4rem 1.1rem;min-height:50px;cursor:grab;user-select:none}
.chip.sel{background:var(--blue-d);color:#fff;transform:scale(1.05)}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:.7rem}
.slot{display:flex;justify-content:space-between;align-items:center;gap:.5rem;border:2px solid var(--line);border-radius:14px;padding:.5rem .8rem;min-height:66px;background:#fff;cursor:pointer}
.slot.over{border-color:var(--blue);background:var(--soft-blue)}
.slot.ok{border-color:var(--teal);background:var(--soft-teal);cursor:default}
.slot .drop{color:var(--muted);font-size:.85rem;border:1px dashed #B9CCDD;border-radius:10px;padding:.2rem .6rem;min-width:84px;text-align:center}
.slot .chip{min-height:42px;padding:.2rem .8rem}
code.f{font-family:Consolas,'Courier New',monospace;font-weight:700;background:#EEF4FA;color:#173F5F;border:1px solid #D2E1EE;border-radius:6px;padding:0 .35em;unicode-bidi:isolate;white-space:nowrap}
.calc-row{display:flex;align-items:center;gap:.8rem;flex-wrap:wrap;border:2px solid var(--line);border-radius:12px;padding:.5rem .9rem;margin-bottom:.55rem;background:#fff}
.calc-row code.f{font-size:1.15rem;padding:.15rem .6rem}
.calc-row input{width:140px;text-align:center;font-weight:700}
.calc-row.ok{border-color:var(--teal);background:var(--soft-teal)}
.calc-row.bad{border-color:#E9C27A;background:var(--soft-amber)}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.tbl-tools{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;margin:.4rem 0 .7rem}
.tbl-tools .lbl{margin:0}
select{font:inherit;min-height:48px;padding:.3rem .8rem;border:2px solid var(--line);border-radius:12px;background:#fff;color:var(--text)}
select:focus{border-color:var(--blue);outline:none;box-shadow:0 0 0 3px rgba(61,127,187,.2)}
.tbl-wrap{overflow-x:auto;border-radius:12px;border:1px solid var(--line)}
table.lab{font-size:.95rem;margin:0}
table.lab th{white-space:nowrap}
table.lab td{background:#fff}
table.lab tbody tr:nth-child(even) td{background:#F6FAFD}
.th-in{display:flex;align-items:center;justify-content:space-between;gap:.4rem}
.sbtns{display:inline-flex;gap:.2rem}
.icon-btn.sm{width:40px;height:40px;font-size:.85rem}
.icon-btn.on{background:var(--blue-d);border-color:var(--blue-d);color:#fff}
.blk{display:inline-block;padding:0 .5em;margin:.1em 0;border-radius:8px 8px 8px 8px;border:2px solid;border-inline-start-width:6px;font-weight:700;font-size:.9em;line-height:1.7;color:#1E2B37;unicode-bidi:isolate;white-space:normal}
.blk-events{background:#FFF4CC;border-color:#D9A300}
.blk-control{background:#FFEFD6;border-color:#E08A00}
.blk-motion{background:#E3EEFF;border-color:#4C97FF}
.blk-looks{background:#EFE7FF;border-color:#9966FF}
.blk-sensing{background:#E0F3F9;border-color:#2E9AC0}
.blk-operators{background:#E3F5E3;border-color:#3FA33F}
.blk-variables{background:#FFEBD9;border-color:#E0730A}
.blk-sound{background:#F8E3F8;border-color:#B547B5}
.calc-q{flex:1 1 220px;font-weight:700;color:var(--navy)}
.coord{width:100%;max-width:360px;display:block;margin:0 auto .9rem;background:#fff;border:1px solid var(--line);border-radius:12px}

.coord .pt{fill:#E0730A;stroke:#fff;stroke-width:2}
.coord .pl{font-size:14px;font-weight:800;fill:#1F5F8B;font-family:Tajawal,Arial,sans-serif}
.coord .axl{font-size:12px;font-weight:800;fill:#1F5F8B;font-family:Arial,sans-serif}
.xy{display:inline-flex;align-items:center;gap:.35rem;font-weight:700;direction:ltr}
.xy input{width:84px}
.chip.ok{border-color:var(--teal-d);background:var(--soft-teal);color:#174F42;cursor:default}
.buckets{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:.8rem}
.bucket{border:2px dashed #A9C3DA;border-radius:16px;padding:.7rem;min-height:150px;background:#fff;cursor:pointer}
.bucket.over{border-color:var(--blue);background:var(--soft-blue)}
.bucket>b{display:block;color:var(--navy);text-align:center;margin-bottom:.5rem;padding-bottom:.4rem;border-bottom:1px solid var(--line)}
.bucket-in{display:flex;flex-wrap:wrap;gap:.5rem;justify-content:center}
.bucket-in .chip{min-height:44px;padding:.2rem .8rem}
.unit-block{margin-bottom:1.6rem}
.unit-head{display:flex;align-items:center;gap:.8rem;flex-wrap:wrap;background:var(--soft-blue);border-radius:14px;padding:.6rem 1rem;margin-bottom:.8rem}
.unit-head .ic{font-size:2rem}
.opts{display:grid;gap:.6rem;margin:.8rem 0}
.opt{font:inherit;text-align:start;background:#fff;border:2px solid var(--line);border-radius:12px;padding:.65rem 1rem;min-height:54px;cursor:pointer;color:var(--text);font-weight:500}
.opt:hover:not([disabled]){border-color:var(--blue);background:var(--soft-blue)}
.opt.right{border-color:var(--teal);background:var(--soft-teal);font-weight:800}
.opt.right::before{content:"✓ ";color:var(--teal-d)}
.opt.wrong{border-color:#E2B7AE;background:var(--soft-red);text-decoration:line-through;color:#7A4A40}
.opt[disabled]{cursor:default}
.order-list{list-style:none;padding:0;margin:.8rem 0;display:grid;gap:.5rem}
.order-item{display:flex;align-items:center;gap:.7rem;background:#fff;border:2px solid var(--line);border-radius:12px;padding:.45rem .8rem}
.order-item .num{width:34px;height:34px;flex:none;border-radius:50%;background:var(--soft-blue);color:var(--navy);font-weight:800;display:grid;place-items:center}
.order-item .txt{flex:1}
.order-btns{display:flex;gap:.3rem}
.icon-btn{font:inherit;width:48px;height:48px;border-radius:10px;border:2px solid var(--line);background:#fff;color:var(--navy);cursor:pointer;font-size:1rem}
.icon-btn:hover:not([disabled]){border-color:var(--blue)}
.icon-btn[disabled]{opacity:.3}
.checklist{list-style:none;padding:0;display:grid;gap:.5rem}

/* التغذية الراجعة */
.fb{border-radius:12px;padding:.8rem 1rem;margin:.8rem 0;border:2px solid}
.fb.ok{background:var(--soft-teal);border-color:var(--teal);color:#174F42}
.fb.no{background:var(--soft-amber);border-color:#E9C27A;color:#5E3B00}
.fb.info{background:var(--soft-blue);border-color:#B5CFE6;color:var(--navy)}
.qdots{display:flex;gap:.35rem;flex-wrap:wrap;margin-bottom:.8rem}
.qdots span{width:30px;height:8px;border-radius:5px;background:var(--line)}
.qdots span.on{background:var(--blue)}
.qdots span.ok{background:var(--teal)}

/* التقويم الذاتي */
fieldset.self-item{border:1px solid var(--line);border-radius:14px;padding:.7rem 1rem;margin:0 0 .8rem;background:#FBFDFE}
fieldset.self-item legend{font-weight:700;padding:0 .4rem;color:var(--navy)}
.seg{display:flex;gap:.5rem;flex-wrap:wrap}
.seg label{flex:1;min-width:120px}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:flex;justify-content:center;align-items:center;min-height:50px;border:2px solid var(--line);border-radius:12px;font-weight:700;cursor:pointer;background:#fff;padding:.2rem .5rem;text-align:center}
.seg input:focus-visible+span{outline:3px solid #E8A400;outline-offset:2px}

.seg .v-p input:checked+span,.seg .v-g input:checked+span{background:var(--soft-blue);border-color:var(--blue-d);color:var(--navy)}
.seg .v-n input:checked+span,.seg .v-i input:checked+span{background:var(--soft-amber);border-color:#C98A1E;color:#5E3B00}
.substeps{color:var(--muted);font-weight:700;font-size:.9rem;margin-bottom:.4rem}

/* النتيجة والإنجازات */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:.8rem;margin:1rem 0}
.stat{background:var(--soft-blue);border-radius:14px;padding:.8rem;text-align:center}
.stat b{display:block;font-size:1.7rem;color:var(--navy)}
.stat.teal{background:var(--soft-teal)}
.recs{padding-inline-start:1.2rem}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:.8rem}
.badge{border:2px solid var(--teal);border-radius:16px;padding:1rem;text-align:center;background:var(--soft-teal)}
.badge .ic{font-size:2.6rem;display:block}
.badge b{color:var(--navy);display:block}

table.tbl{width:100%;border-collapse:collapse;font-size:.9rem}
table.tbl th,table.tbl td{border:1px solid var(--line);padding:.35rem .5rem;text-align:start;vertical-align:top}

/* تقويم الوحدات */
.uq{border:2px solid var(--line);border-radius:14px;padding:.8rem 1rem;margin-bottom:.8rem;background:#FBFDFE}

.uq-n{width:34px;height:34px;flex:none;border-radius:50%;background:var(--blue-d);color:#fff;display:grid;place-items:center}
.uopts{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;margin-top:.6rem}
@media (max-width:600px){.uopts{grid-template-columns:1fr}}
.uopt{position:relative}
.uopt input{position:absolute;opacity:0;pointer-events:none}

  background:linear-gradient(120deg,#43307E,#3D7FBB 55%,#3FA88F);box-shadow:0 6px 20px rgba(67,48,126,.25);font-weight:500;line-height:1.7}

  background:radial-gradient(circle at 85% 20%,rgba(255,255,255,.18),transparent 40%),linear-gradient(135deg,#231C55,#43307E 45%,#3D7FBB)}

.adv-world{border-radius:var(--radius);margin:1rem 0;overflow:hidden;background:linear-gradient(180deg,var(--w1),var(--w2));box-shadow:var(--shadow);border-bottom:10px solid var(--wg)}

.adv-nodes{display:flex;align-items:flex-start;justify-content:center;gap:.2rem;padding:1.2rem .6rem 1rem;flex-wrap:nowrap}

.adv-node{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;font-size:1.6rem;font-weight:800;text-decoration:none;border:4px solid #fff;box-shadow:0 5px 0 rgba(0,0,0,.18)}

.adv-path{flex:1;max-width:90px;min-width:16px;height:6px;margin-top:33px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.95) 0 10px,transparent 10px 18px);border-radius:3px}
.game-wrap{background:#10142B;border-radius:16px;padding:.6rem;position:relative}
.game-wrap:fullscreen{display:flex;flex-direction:column;justify-content:center;border-radius:0;padding:1rem}
.game-wrap:fullscreen canvas{height:calc(100vh - 170px);width:auto;max-width:100%;margin:0 auto}
.game-top{display:flex;justify-content:space-between;align-items:center;gap:.5rem;flex-wrap:wrap;margin-bottom:.5rem}
.game-hud{display:flex;gap:.5rem;flex-wrap:wrap}

.game-pad{display:flex;justify-content:space-between;align-items:center;gap:1rem;margin-top:.6rem;user-select:none;-webkit-user-select:none;touch-action:none}
.pad-move{display:flex;gap:.6rem}
.pad-btn{font:inherit;font-weight:800;font-size:1.5rem;min-width:74px;min-height:64px;border-radius:16px;border:none;background:rgba(255,255,255,.14);color:#fff;
  box-shadow:0 5px 0 rgba(0,0,0,.35);touch-action:none;cursor:pointer}
.pad-btn.jump{background:#3FA88F;min-width:104px;font-size:1.2rem}

.stars{font-size:2.2rem;margin:.2rem 0;letter-spacing:.2rem}
.intro-list{text-align:start;list-style:none;padding:0;display:grid;gap:.4rem;margin:.5rem 0 .9rem;font-size:.95rem}
.intro-list li{background:var(--soft-blue);border-radius:12px;padding:.45rem .8rem}
#toast{z-index:95 !important}
.site-foot{text-align:center;padding:1.2rem 1rem 2rem;color:var(--muted);border-top:1px solid var(--line);background:#fff;font-size:.88rem;line-height:1.7}
.site-foot p{margin:.15rem 0}
#copyText{font-weight:700;color:var(--navy)}
.foot-note{font-size:.8rem}
@media (max-height:520px){
  .topbar{position:static}
  .game-wrap{position:relative;padding:.4rem}
  .game-top{margin-bottom:.3rem}
  #advCanvas{width:min(100%, calc((100vh - 70px) * 1.6))}
  .game-pad{position:absolute;left:.9rem;right:.9rem;bottom:.9rem;margin:0;pointer-events:none}
  .game-pad .pad-btn{pointer-events:auto;opacity:.82;min-height:50px;min-width:62px;font-size:1.1rem}
  .game-pad .pad-btn.jump,.game-pad .pad-btn.fwd{min-width:86px}
}
.intro-hero{height:90px;width:auto;display:block;margin:0 auto .3rem;filter:drop-shadow(0 6px 6px rgba(0,0,0,.18));animation:bob 2.4s ease-in-out infinite}
.adv-hero-chip{display:inline-flex;align-items:center;gap:.4rem;background:var(--soft-blue);border-radius:999px;padding:.15rem .8rem .15rem .3rem;font-weight:700;color:var(--navy);font-size:.88rem}
.adv-hero-chip img{height:40px;width:auto}
.qbox{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:6px;background:#F5B92A;color:#fff;font-weight:800}
#toast{position:fixed;bottom:1.2rem;right:50%;transform:translateX(50%) translateY(150%);background:var(--navy);color:#fff;padding:.7rem 1.3rem;border-radius:14px;font-weight:700;z-index:60;transition:transform .35s;max-width:92vw;text-align:center}
#toast.show{transform:translateX(50%) translateY(0)}

/* الطباعة */
#print-area{display:none}
@media print{
  body>*:not(#print-area){display:none!important}
  #print-area{display:block}
  body{background:#fff;font-size:12pt}
  .pc h1{font-size:18pt} .pc h2{font-size:13pt;margin-top:10pt}
  .pc table{page-break-inside:auto} .pc tr{page-break-inside:avoid}
  .pc .head{display:flex;justify-content:space-between;border-bottom:3px solid #3D7FBB;padding-bottom:6pt;margin-bottom:8pt}
  .pc .sign{margin-top:18pt;display:flex;justify-content:space-between}
  .cert{border:10px double #3D7FBB;border-radius:16px;padding:28pt;text-align:center;height:175mm;display:flex;flex-direction:column;justify-content:center}
  .cert h1{font-size:30pt;color:#1F5F8B} .cert .nm{font-size:26pt;color:#2A8069;font-weight:800;margin:10pt 0}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<body>
<a class="skip" href="#main">تخطّي إلى المحتوى</a>
<header class="topbar">
  <div class="topbar-in">
    <a class="brand" href="#/"><span class="brand-logo" aria-hidden="true">💡</span><span><span id="brandTitle">أتعلم بنفسي</span><small id="brandSub"></small></span></a>
    <nav class="main-nav" aria-label="القائمة الرئيسية">
      <a href="#/" data-page="home"><span aria-hidden="true">🏠</span> الرئيسية</a>
      <a href="#/units" data-page="units"><span aria-hidden="true">📝</span> تقويم الوحدات</a>
      <a href="#/adventure" data-page="adventure"><span aria-hidden="true">🎮</span> بوابة المغامرة</a>
      <a href="#/achievements" data-page="achievements"><span aria-hidden="true">🏅</span> إنجازاتي</a>
      <a href="#/teacher" data-page="teacher"><span aria-hidden="true">👩‍🏫</span> دليل المعلمة</a>
    </nav>
    <div class="hello" id="hello" aria-live="polite"></div>
  </div>
</header>
<main id="main" tabindex="-1"></main>
<footer class="site-foot"><p id="copyText"></p><p class="foot-note">المحتوى العلمي مبني على كتاب «المهارات الرقمية» للصف السادس الابتدائي — وزارة التعليم.</p></footer>
<div id="toast" role="status" aria-live="polite"></div>
<div id="print-area"></div>

<script>
/* ==========================================================
   ⚙️ محرّك الموقع — لا تحتاجين لتعديل شيء هنا
   ========================================================== */
const SECTIONS = [
  {key:'plan',label:'أخطط',icon:'🗺️'},{key:'learn',label:'أتعلم',icon:'📖'},
  {key:'apply',label:'أطبّق',icon:'🛠️'},{key:'quiz',label:'أختبر فهمي',icon:'✏️'},
  {key:'self',label:'أقيّم نفسي',icon:'🪞'},{key:'result',label:'نتيجتي',icon:'🏅'},
  {key:'challenge',label:'تحدي المتميزات',icon:'⭐'}
];
const REQUIRED = ['plan','learn','apply','quiz','self','result'];
const STORE_KEY = 'ataallam-' + SETTINGS.storageId;
let memStore = null, teacherOK = false, currentId = null, matchSel = null;

/* ---- الحفظ ---- */
function fresh(){ return {name:'', className:'', lessons:{}, units:{}, recoveries:0, badges:[], outbox:[], sent:{}}; }
function load(){
  try{ const s = localStorage.getItem(STORE_KEY); if(s) return Object.assign(fresh(), JSON.parse(s)); }catch(e){}
  return memStore || fresh();
}
let state = load();
function save(){
  checkBadges();
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){ memStore = state; }
}
function ls(id){
  if(!state.lessons[id]) state.lessons[id] = {sections:{}, current:'plan', goal:'', applyStep:0, acts:{}, orders:{}, checklist:[],
    quiz:{idx:0, answers:{}, finished:false, score:0, best:0}, selfStep:0,
    self:{ratings:{}, reflections:['','',''], satisfaction:''}, challenge:{done:false, note:''}};
  return state.lessons[id];
}

/* ---- أدوات ---- */
const $ = s => document.querySelector(s);
function fmt(s){ return esc(s).replace(/`([^`]+)`/g, '<code class="f" dir="ltr">$1</code>').replace(/\{\{(\w+):([^{}]+)\}\}/g, '<span class="blk blk-$1">$2</span>'); }
function plain(s){ return String(s ?? '').replace(/`/g, '').replace(/\{\{\w+:([^{}]+)\}\}/g, '$1'); }
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
const getLesson = id => lessons.find(l => l.id === id);
const live = () => lessons.filter(l => !l.comingSoon);
const doneCount = id => { const L = state.lessons[id]; return L ? REQUIRED.filter(k => L.sections[k]).length : 0; };
const pctOf = id => Math.round(doneCount(id) / REQUIRED.length * 100);
const isComplete = id => doneCount(id) === REQUIRED.length;
function statusOf(id){ const p = doneCount(id);
  if(p === 0) return {t:'لم يبدأ', c:'st-new'};
  if(p < REQUIRED.length) return {t:'قيد التعلم', c:'st-prog'};
  return {t:'مكتمل ✓', c:'st-done'}; }
function nm(){ return state.name || 'متعلمتنا'; }
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 3200); }
function shuffledIdx(n){ const a = [...Array(n).keys()]; if(n < 2) return a;
  do{ for(let i = n-1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } }while(a.every((x,i) => x === i));
  return a; }
function getOrder(L, key, n){ if(!L.orders[key] || L.orders[key].length !== n) L.orders[key] = shuffledIdx(n); return L.orders[key]; }
function refTitle(l, ref){ if(ref === 'steps') return 'الخطوات العملية'; const p = l.learn.points.find(x => x.id === ref); return p ? p.title : 'الشرح'; }
function todayStr(){ const d = new Date(); let h = '', g = '';
  try{ h = d.toLocaleDateString('ar-SA-u-ca-islamic-umalqura-nu-latn',{day:'numeric',month:'long',year:'numeric'}); }catch(e){}
  try{ g = d.toLocaleDateString('ar-u-nu-latn',{day:'numeric',month:'long',year:'numeric'}); }catch(e){ g = d.toLocaleDateString(); }
  return h ? `${h} — ${g}` : g; }
function ytId(url){ if(!url) return null; const m = url.match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([\w-]{11})/); return m ? m[1] : null; }
function progressBar(p, label){ return `<div class="progress" role="progressbar" aria-label="${esc(label)}" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${p}"><span style="width:${p}%"></span></div>`; }

/* ---- 📨 إرسال النتائج إلى نموذج Google ---- */
// الكلمات التي تكتبها المعلمة في «الرابط المعبأ مسبقًا» لتعريف كل خانة
const FORM_FIELDS = {
  name:  ['الاسم', 'name'],        cls:  ['الفصل', 'class'],
  type:  ['النوع', 'type'],        title:['العنوان', 'title'],
  score: ['الدرجة', 'score'],      self: ['التقويم', 'self'],
  sat:   ['الرضا', 'satisfaction'], refl: ['التأملات', 'reflection']
};
const FIELD_LABELS = {name:'الاسم', cls:'الفصل', type:'النوع', title:'العنوان', score:'الدرجة', self:'التقويم', sat:'الرضا', refl:'التأملات'};
function formCfg(linkIn){
  const link = String(linkIn !== undefined ? linkIn : (SETTINGS.resultsFormLink || '')).trim().replace(/^["'«]+|["'»]+$/g, ''); if(!link) return null;
  try{
    const u = new URL(link); let provider = null;
    if(/(^|\.)docs\.google\.com$/.test(u.hostname) && /\/forms\//.test(u.pathname)) provider = 'google';
    else if(/(^|\.)(forms\.office\.com|forms\.microsoft\.com|forms\.cloud\.microsoft|forms\.office365\.us)$/.test(u.hostname)) provider = 'ms';
    if(!provider) return {error:'الرابط ليس رابط نموذج Microsoft Forms أو Google Forms.'};
    const skip = ['id','lang','origin','embed','sharetoken','usp'], map = {}; let extra = 0;
    u.searchParams.forEach((v,k) => {
      if(provider === 'google' && !k.startsWith('entry.')) return;
      if(provider === 'ms' && skip.includes(k)) return;
      extra++;
      const val = v.trim().replace(/^"|"$/g, '').toLowerCase();
      for(const f in FORM_FIELDS) if(FORM_FIELDS[f].some(w => w.toLowerCase() === val)) map[f] = k; });
    // Microsoft Forms برابط عادي: الطالبة تنسخ نتيجتها وتلصقها في النموذج
    if(provider === 'ms' && extra === 0) return {provider, mode:'paste', map, link: u.href};
    if(provider === 'google' && extra === 0) return {provider, error:'هذا رابط المشاركة العادي لنموذج Google، وليس «الرابط المعبأ مسبقًا». من ⋮ اختاري «الحصول على رابط معبأ مسبقًا».'};
    if(!map.name || !map.score) return {provider, map, error:'لم أجد خانتي «الاسم» و«الدرجة» في الرابط. تأكدي أنكِ كتبتِ عنوان كل خانة داخلها في الرابط المعبأ مسبقًا، ثم نسختِ الرابط الجديد.'};
    const action = provider === 'google' ? u.origin + u.pathname.replace(/\/(viewform|edit|prefill)[^/]*$/, '') + '/formResponse' : null;
    return {provider, mode: provider === 'ms' ? 'prefill' : 'auto', action, map, link: u.href};
  }catch(e){ return {error:'تعذّرت قراءة الرابط. انسخيه كاملًا كما هو.'}; }
}
// ملخص النتيجة في سطر واحد (للنسخ واللصق) — مفصول بالرمز | ليسهل تقسيمه في Excel
function summaryText(d){ return Object.keys(FIELD_LABELS).map(f => `${FIELD_LABELS[f]}: ${String(d[f] ?? '—').replace(/\s*[|\n]+\s*/g, '، ')}`).join(' | '); }
async function copyText(t){
  try{ await navigator.clipboard.writeText(t); return true; }catch(e){}
  try{ const ta = document.createElement('textarea'); ta.value = t; ta.setAttribute('readonly',''); ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select(); const ok = document.execCommand('copy'); ta.remove(); return ok; }catch(e){ return false; }
}
// رابط Microsoft Forms معبأ بنتيجة الطالبة
function msUrl(data, cfg){
  const c = cfg || formCfg(), u = new URL(c.link), parts = [];
  u.searchParams.forEach((v,k) => { const f = Object.keys(c.map).find(x => c.map[x] === k);
    parts.push(encodeURIComponent(k) + '=' + encodeURIComponent(f ? String(data[f] ?? '').slice(0, 900) : v)); });
  return u.origin + u.pathname + '?' + parts.join('&') + u.hash;
}
function testPayload(){ return { name: 'نتيجة تجريبية', cls: '—', type: 'تجربة', title: 'اختبار الإرسال من دليل المعلمة', score: '—', self: '—', sat: '—', refl: todayStr() }; }
function payloadFor(key){
  const [t, id] = key.split(':');
  if(t === 'lesson'){ const l = getLesson(id); return l && state.lessons[id] ? lessonPayload(l, ls(id)) : null; }
  if(t === 'unit'){ const u = getUnit(id); return u && state.units && state.units[id] ? unitPayload(u, us(id)) : null; }
  return null;
}
function queueSend(key, data){
  const c = formCfg(); if(!c || c.error || c.provider !== 'google') return;
  state.outbox = (state.outbox || []).filter(x => x.key !== key);
  state.outbox.push({key, data, at: Date.now()}); save(); flushOutbox();
}
let flushing = false;
async function flushOutbox(){
  const c = formCfg(); if(flushing || !c || c.error || c.provider !== 'google' || !(state.outbox || []).length) return;
  if(typeof navigator !== 'undefined' && navigator.onLine === false) return;
  flushing = true;
  for(const item of [...state.outbox]){
    const body = new URLSearchParams();
    for(const f in c.map) body.append(c.map[f], item.data[f] ?? '');
    try{
      await fetch(c.action, {method:'POST', mode:'no-cors', body});
      state.outbox = state.outbox.filter(x => x !== item); state.sent = state.sent || {}; state.sent[item.key] = Date.now(); save();
    }catch(e){ break; }
  }
  flushing = false;
  const st = document.getElementById('sendStatus'); if(st) st.outerHTML = sendStatus(st.dataset.key);
}
function sendStatus(key){
  const c = formCfg(); if(!c || c.error) return '';
  if(c.provider === 'ms' && c.mode === 'paste'){
    const data = payloadFor(key); if(!data) return '';
    const opened = state.sent && state.sent[key];
    return `<div id="sendStatus" data-key="${esc(key)}" class="fb info" style="margin:.7rem 0 0">
      <p style="margin:0 0 .5rem"><b>📨 أرسلي نتيجتك إلى معلمتك في خطوتين:</b><br>١) اضغطي الزر: تُنسخ نتيجتك ويُفتح النموذج.<br>٢) في النموذج الصقي النتيجة في خانة الإجابة (<span dir="ltr">Ctrl + V</span>، أو اضغطي مطولًا ثم «لصق»)، ثم اضغطي <b>«إرسال»</b>.</p>
      <a class="btn success" href="${esc(c.link)}" target="_blank" rel="noopener" data-msopen="${esc(key)}" data-copy="1">📋 انسخي نتيجتي وافتحي النموذج</a>
      <details style="margin-top:.6rem"><summary style="cursor:pointer">إذا لم تُنسخ النتيجة تلقائيًا</summary>
        <p style="margin:.4rem 0">حدّدي النص كله وانسخيه، ثم الصقيه في النموذج:</p>
        <textarea readonly onfocus="this.select()" style="min-height:120px;font-size:.9rem">${esc(summaryText(data))}</textarea></details>
      ${opened ? '<p style="margin:.5rem 0 0">✓ فتحتِ النموذج. تأكدي أنكِ لصقتِ النتيجة وضغطتِ «إرسال» وظهرت رسالة الشكر.</p>' : ''}</div>`;
  }
  if(c.provider === 'ms'){
    const data = payloadFor(key); if(!data) return '';
    const opened = state.sent && state.sent[key];
    return `<div id="sendStatus" data-key="${esc(key)}" class="fb info" style="margin:.7rem 0 0">
      <p style="margin:0 0 .5rem">📨 <b>أرسلي نتيجتك إلى معلمتك:</b> اضغطي الزر، فيُفتح نموذج فيه نتيجتك جاهزة، ثم اضغطي <b>«إرسال» (Submit)</b> في آخر النموذج.</p>
      <a class="btn success" href="${esc(msUrl(data))}" target="_blank" rel="noopener" data-msopen="${esc(key)}">📨 أرسلي نتيجتي لمعلمتي</a>
      ${opened ? '<p style="margin:.5rem 0 0">✓ فتحتِ النموذج. تأكدي أنكِ ضغطتِ «إرسال» وظهرت رسالة الشكر.</p>' : ''}</div>`;
  }
  const pending = (state.outbox || []).some(x => x.key === key), sent = state.sent && state.sent[key];
  const msg = pending ? '⏳ ستُرسل نتيجتك إلى معلمتك تلقائيًا عند الاتصال بالإنترنت.' : (sent ? '📨 أُرسلت نتيجتك إلى معلمتك ✓' : '');
  return msg ? `<p id="sendStatus" data-key="${esc(key)}" class="muted" style="margin:.4rem 0 0" role="status">${msg}</p>` : '';
}
function lessonPayload(l, L){
  const R = computeResult(l, L), u = getUnit(l.unit);
  return { name: state.name || 'بدون اسم', cls: state.className || '—', type: 'درس',
    title: (u ? u.number + ' • ' : '') + l.title,
    score: L.sections.quiz ? `${L.quiz.score} / ${l.quiz.length} (${R.pct}%)` : 'لم يكمل الاختبار',
    self: `أتقنت ${R.m}، أحتاج تدريبًا ${R.p}، لم أتقن ${R.n} (من ${l.self.length})`,
    sat: (SATS.find(x => x[0] === L.self.satisfaction) || ['','—'])[1].replace(/[^\u0600-\u06FF\s—]/g, '').trim(),
    refl: SETTINGS.reflectionQuestions.map((q,i) => `${i+1}) ${L.self.reflections[i] || '—'}`).join('   ') };
}
function unitPayload(u, U){
  return { name: state.name || 'بدون اسم', cls: state.className || '—', type: 'تقويم وحدة',
    title: `تقويم ${u.number}: ${u.name}`, score: `${U.score} / ${unitQs(u).length}`, self: '—', sat: '—', refl: '—' };
}

/* ---- الشارات ---- */
const BADGE_RULES = {
  independent: () => live().some(l => isComplete(l.id)),
  persistent:  () => state.recoveries >= 3,
  creative:    () => Object.values(state.lessons).some(L => L.challenge && L.challenge.done),
  star:        () => live().some(l => state.lessons[l.id] && state.lessons[l.id].quiz.best === l.quiz.length),
  reflective:  () => Object.values(state.lessons).some(L => L.sections && L.sections.self),
  champion:    () => lessons.length > 0 && lessons.every(l => !l.comingSoon && isComplete(l.id)),
  unitMaster:  () => units.some(u => u.assessment && state.units[u.id] && state.units[u.id].best === unitQs(u).length),
  adventurer:  () => !!(state.adv && state.adv.done && Object.keys(state.adv.done).length),
  legend:      () => !!(state.adv && state.adv.done && Object.keys(state.adv.done).length >= units.length * 3)
};

/* ---- أدوات تقويم الوحدات ---- */
const LETTERS = ['أ','ب','ج','د','هـ','و'];
const getUnit = id => units.find(u => u.id === id);
function us(id){ state.units = state.units || {}; if(!state.units[id]) state.units[id] = {answers:{}, submitted:false, score:0, best:0, date:''}; return state.units[id]; }
function unitQs(u){ const out = []; if(!u.assessment) return out; u.assessment.sections.forEach((s,si) => s.questions.forEach((q,qi) => out.push(Object.assign({key:si+'-'+qi, type:s.type}, q)))); return out; }
function uCorrect(q, v){ return q.type === 'tf' ? (v === 't') === q.answer : Number(v) === q.answer; }
function uAnswerText(q, v){ if(v === undefined) return '—'; return q.type === 'tf' ? (v === 't' ? '✓ صحيحة' : '✗ خاطئة') : LETTERS[v] + ') ' + q.options[v]; }
function checkBadges(){
  badges.forEach(b => { const rule = BADGE_RULES[b.id];
    if(rule && rule() && !state.badges.includes(b.id)){ state.badges.push(b.id); setTimeout(() => toast(`🎉 حصلتِ على شارة جديدة: ${b.name} ${b.icon}`), 600); } });
}

/* ==================== الصفحات ==================== */
function viewHome(){
  const L = live(), total = L.length * REQUIRED.length, done = L.reduce((a,l) => a + doneCount(l.id), 0);
  const pct = total ? Math.round(done/total*100) : 0;
  const flow = [['🗺️','أخطط','أعرف هدفي وأحدد وقتي'],['📖','أتعلم','أشاهد وأقرأ الخطوات'],['🛠️','أطبّق','أجرّب النشاط والمهمة'],['🪞','أقيّم نفسي','أختبر فهمي وأتأمل']];
  const blocks = units.map(u => {
    const UL = lessons.filter(l => l.unit === u.id), done = UL.filter(l => !l.comingSoon && isComplete(l.id)).length;
    return `<section class="unit-block" aria-labelledby="h-${u.id}"><div class="unit-head"><span class="ic" aria-hidden="true">${u.icon}</span>
      <div style="flex:1"><p class="kicker">${esc(u.number)}</p><h2 id="h-${u.id}" style="margin:0">${esc(u.name)}</h2></div>
      <span class="pill ${done && done === UL.length ? 'st-done' : 'st-new'}">أنجزتِ ${done} من ${UL.length}</span></div>
      <div class="grid">${UL.map((l,n) => lessonCard(l, n)).join('')}${unitCard(u)}</div></section>`;
  }).join('');
  const orphan = lessons.filter(l => !getUnit(l.unit));
  return `
  <section class="card hero"><div>
    <h1>${esc(SETTINGS.welcomeTitle)}</h1><p>${esc(SETTINGS.welcomeText)}</p>
    <p class="lbl" style="margin-bottom:.2rem">اكتبي اسمك وفصلك ليظهرا في الموقع وبطاقة نتيجتك:</p>

  </div><div class="hero-art" aria-hidden="true">💻</div></section>

  <section class="card"><div class="row spread"><h2 style="margin:0">تقدّمي العام</h2><strong style="font-size:1.3rem;color:var(--teal-d)">${pct}%</strong></div>
    ${progressBar(pct,'التقدم العام')}<p class="muted" style="margin-top:.5rem">${pct === 100 && L.length === lessons.length ? 'أكملتِ جميع الدروس! اذهبي إلى «إنجازاتي» لطباعة شهادتك 🏆' : 'كل خطوة تنجزينها تقرّبك من شهادة الإنجاز.'}</p></section>

  <h2>دروسي</h2>${blocks}${orphan.length ? `<section class="unit-block"><div class="grid">${orphan.map((l,n) => lessonCard(l,n)).join('')}</div></section>` : ''}`;
}
const ORD = ['الأول','الثاني','الثالث','الرابع','الخامس','السادس','السابع','الثامن','التاسع','العاشر'];
function lessonCard(l, n){
  const k = `الدرس ${ORD[n] || n+1}`;
  if(l.comingSoon) return `<article class="card lesson-card soon"><span class="ic" aria-hidden="true">${l.icon}</span><p class="kicker">${k}</p><h3>${esc(l.title)}</h3><p class="grow muted">${esc(l.description)}</p><span class="pill st-soon">قريبًا ⏳</span></article>`;
  const st = statusOf(l.id), p = pctOf(l.id);
  const btn = p === 0 ? 'ابدئي الدرس' : (p < 100 ? 'أكملي التعلّم' : 'راجعي الدرس');
  return `<article class="card lesson-card"><span class="ic" aria-hidden="true">${l.icon}</span><p class="kicker">${k}</p><h3>${esc(l.title)}</h3><p class="grow muted">${esc(l.description)}</p>
    <div class="row spread"><span class="pill ${st.c}">${st.t}</span><strong>${p}%</strong></div>${progressBar(p,'تقدم الدرس')}
    <a class="btn" href="#/lesson/${l.id}">${btn} ←</a></article>`;
}
function lessonLabel(l){
  const u = getUnit(l.unit); const n = lessons.filter(x => x.unit === l.unit).indexOf(l);
  return (u ? `${u.number}: ${u.name} • ` : '') + `الدرس ${ORD[n] || n+1}`;
}

/* 📝 تقويم الوحدات */
function unitCard(u){
  if(!u.assessment) return `<article class="card lesson-card soon"><span class="ic" aria-hidden="true">📝</span><p class="kicker">${esc(u.number)}</p><h3>تقويم ${esc(u.number)}</h3><p class="grow muted">${esc(u.name)}</p><span class="pill st-soon">قريبًا ⏳</span></article>`;
  const U = state.units && state.units[u.id], n = unitQs(u).length;
  const st = U && U.submitted ? `<span class="pill st-done">أفضل درجة: ${U.best} من ${n}</span>` : '<span class="pill st-new">لم يُحل بعد</span>';
  return `<article class="card lesson-card"><span class="ic" aria-hidden="true">📝</span><p class="kicker">${esc(u.term)}</p><h3>تقويم ${esc(u.number)}</h3>
    <p class="grow muted">${esc(u.name)} • ${n} أسئلة</p>${st}<a class="btn" href="#/unit/${u.id}">${U && U.submitted ? 'راجعي التقويم' : 'ابدئي التقويم'} ←</a></article>`;
}
function viewUnits(){
  return `<section class="card"><h1>📝 تقويم الوحدات</h1><p>بعد إنهاء دروس الوحدة، اختبري نفسكِ في تقويمها. تظهر درجتكِ والإجابات الصحيحة فور التصحيح.</p></section>
    <div class="grid">${units.map(unitCard).join('')}</div>`;
}
function viewUnit(u){
  const U = us(u.id), Q = unitQs(u), sub = U.submitted;
  let top = '';
  if(sub){
    const pct = Math.round(U.score / Q.length * 100), level = pct >= 90 ? 'excellent' : (pct >= 60 ? 'good' : 'review');
    top = `<section class="card"><h2>🏅 نتيجة التقويم</h2><div class="fb ok"><strong>${esc(SETTINGS.resultMessages[level].replace('{name}', nm()))}</strong></div>
      <div class="stats"><div class="stat teal"><b>${U.score} / ${Q.length}</b>درجتي</div><div class="stat"><b>${pct}%</b>نسبتي</div><div class="stat"><b>${U.best} / ${Q.length}</b>أفضل درجة</div></div>
      <p>${U.score === Q.length ? 'أجبتِ عن جميع الأسئلة إجابة صحيحة 🎯' : 'الأسئلة المظللة باللون البرتقالي تحتاج مراجعة، وتحت كل منها الإجابة الصحيحة وتوضيحها.'}</p>
      ${sendStatus('unit:' + u.id)}<div class="row" style="margin-top:.6rem"><button class="btn success" data-act="unitPrint" data-u="${u.id}">🖨️ طباعة / حفظ PDF</button><button class="btn secondary" data-act="unitRetry" data-u="${u.id}">↻ أعيدي التقويم</button></div></section>`;
  }
  let num = 0;
  const secs = u.assessment.sections.map((s,si) => `<section class="card"><div class="row spread"><h2 style="margin:0">${esc(s.title)}</h2><span class="pill st-done">${s.questions.length} درجات</span></div><div style="margin-top:.8rem">
    ${s.questions.map((q0,qi) => { num++; const key = si+'-'+qi, q = Object.assign({type:s.type}, q0), v = U.answers[key];
      const opts = s.type === 'tf' ? [['t','✓','صحيحة'],['f','✗','خاطئة']] : q.options.map((o,k) => [String(k), LETTERS[k], o]);
      const right = s.type === 'tf' ? (q.answer ? 't' : 'f') : String(q.answer);
      const ok = sub && v !== undefined && uCorrect(q, v);
      return `<fieldset class="uq ${sub ? (ok ? 'is-right' : 'is-wrong') : ''}" id="uq-${key}"><legend class="uq-h" style="display:contents"><span class="uq-n">${num}</span><span>${esc(q.q)}</span></legend>
        <div class="uopts" ${s.type === 'tf' ? 'style="grid-template-columns:1fr 1fr"' : ''}>${opts.map(([val,let_,txt]) => { let cls = '';
          if(sub && val === right) cls = 'correct'; else if(sub && val === v) cls = 'chosen-wrong';
          return `<label class="uopt ${cls}"><input type="radio" name="u-${u.id}-${key}" value="${val}" data-uq="${key}" data-u="${u.id}" ${v === val ? 'checked' : ''} ${sub ? 'disabled' : ''}><span><span class="let">${let_}</span>${esc(txt)}</span></label>`; }).join('')}</div>
        ${sub ? (ok ? `<div class="fb ok">✓ إجابة صحيحة ${q.explain ? '— ' + esc(q.explain) : ''}</div>` : `<div class="fb no">الإجابة الصحيحة: <b>${esc(uAnswerText(q, right))}</b>${q.explain ? '<br>💡 ' + esc(q.explain) : ''}</div>`) : ''}</fieldset>`; }).join('')}</div></section>`).join('');
  const answered = Q.filter(q => U.answers[q.key] !== undefined).length;
  return `<section class="card"><p class="kicker">${esc(u.term)} • سادس ابتدائي</p><h1>تقويم ${esc(u.number)}: ${esc(u.name)}</h1>
    <p class="muted">الاسم: <b>${esc(state.name || 'اكتبي اسمك في الصفحة الرئيسية')}</b></p>${sub ? '' : `<p>${esc(u.assessment.instructions)}</p>`}</section>
    ${top}${secs}
    ${sub ? '' : `<div class="card row spread"><span class="muted">أجبتِ عن ${answered} من ${Q.length}</span><button class="btn success" data-act="unitSubmit" data-u="${u.id}">✓ صحّحي إجاباتي</button></div>`}
    <div class="nav-row"><a class="btn secondary" href="#/units">→ كل التقويمات</a><a class="btn ghost" href="#/">🏠 الرئيسية</a></div>`;
}

function viewLesson(l, sec, ref){
  const L = ls(l.id); currentId = l.id;
  if(sec && SECTIONS.some(s => s.key === sec)) L.current = sec;
  sec = L.current || 'plan'; save();
  const p = pctOf(l.id);
  const steps = SECTIONS.map(s => `<li><a href="#/lesson/${l.id}/${s.key}" class="${L.sections[s.key] || (s.key==='challenge' && L.challenge.done) ? 'done' : ''}" ${s.key===sec ? 'aria-current="step"' : ''}><span class="ic" aria-hidden="true">${s.icon}</span>${s.label}</a></li>`).join('');
  const views = {plan:secPlan, learn:secLearn, apply:secApply, quiz:secQuiz, self:secSelf, result:secResult, challenge:secChallenge};
  return `
  <div class="card"><div class="lesson-head"><span class="ic" aria-hidden="true">${l.icon}</span>
    <div style="flex:1;min-width:200px"><p class="kicker">${esc(lessonLabel(l))}</p><h1 style="margin:0">${esc(l.title)}</h1>${l.bookPages ? `<p class="muted" style="margin:.2rem 0 0;font-size:.9rem">📘 في الكتاب: صفحة ${esc(l.bookPages)}</p>` : ''}</div>
    <div style="min-width:170px;flex:0 1 240px"><div class="row spread"><span class="muted">تقدّمي</span><strong>${p}%</strong></div>${progressBar(p,'تقدم الدرس')}</div></div></div>
  <nav aria-label="أقسام الدرس"><ol class="stepper">${steps}</ol></nav>
  ${views[sec](l, L, ref)}`;
}
function secNav(l, prev, next, nextLabel){
  const P = SECTIONS.find(s => s.key === prev), N = SECTIONS.find(s => s.key === next);
  return `<div class="nav-row">${P ? `<a class="btn secondary" href="#/lesson/${l.id}/${prev}">→ ${P.label}</a>` : '<span></span>'}${N ? `<a class="btn" href="#/lesson/${l.id}/${next}">${nextLabel || N.label} ←</a>` : ''}</div>`;
}

/* 🗺️ أخطط */

    <h3>في هذا الدرس…</h3><ul class="goals">${l.plan.goals.map(g => `<li>سأتعلّم أن ${fmt(g)}</li>`).join('')}</ul>

/* 📖 أتعلم */
function secLearn(l, L, ref){

  let video;
  if(id) video = `<div class="video"><iframe src="https://www.youtube-nocookie.com/embed/${id}?rel=0" title="${esc(l.learn.videoTitle)}" allow="accelerometer; encrypted-media; gyroscope; picture-in-picture" allowfullscreen loading="lazy"></iframe></div>
    <p class="muted" style="margin-top:.5rem">إن لم يظهر الفيديو، <a href="https://www.youtube.com/watch?v=${id}" target="_blank" rel="noopener">افتحيه من هنا ↗</a></p>`;
  else if(v) video = `<a class="btn" href="${esc(v)}" target="_blank" rel="noopener">▶️ افتحي فيديو الدرس ↗</a>`;
  else video = `<div class="ph" role="img" aria-label="مكان فيديو الدرس"><span class="ic" aria-hidden="true">🎬</span><b>${esc(l.learn.videoTitle)}</b><small>سيُضاف الفيديو هنا (رابط مؤقت)</small></div>`;
  const pts = l.learn.points.map(p => `<li id="ref-${p.id}"><b>${esc(p.title)}:</b> ${fmt(p.text)}</li>`).join('');
  const steps = l.learn.steps.map(s => `<li><div class="txt">${fmt(s.text)}</div>${s.image
      ? `<img src="${esc(s.image)}" alt="${esc(s.alt)}" loading="lazy">`
      : `<div class="ph" role="img" aria-label="${esc(s.alt)}"><span class="ic" aria-hidden="true">${s.icon || '🖼️'}</span><small>صورة توضيحية: ${esc(s.alt)}</small></div>`}</li>`).join('');
  return `
  ${ref ? `<div class="fb info">🔎 راجعي الجزء المظلّل باللون الأصفر، ثم عودي إلى سؤالك.</div><a class="btn success back-quiz" href="#/lesson/${l.id}/quiz">↩ عودي إلى الاختبار</a>` : ''}
  <section class="card"><h2>📖 أتعلّم</h2><h3>١. شاهدي الفيديو</h3>${video}</section>
  <section class="card"><h3>٢. أهم الأفكار</h3><ul class="points">${pts}</ul></section>
  <section class="card" id="ref-steps"><h3>٣. الخطوات العملية</h3><ol class="steps">${steps}</ol>
    <div class="nav-row"><a class="btn secondary" href="#/lesson/${l.id}/plan">→ أخطط</a><button class="btn" data-act="learnDone">فهمتُ الشرح، أنتقل إلى «أطبّق» ←</button></div></section>`;
}

/* 🛠️ أطبّق */
function actSt(L, i, a){
  const s = L.acts[i] = L.acts[i] || {};
  if(a.type === 'match'){ s.order = s.order || shuffledIdx(a.pairs.length); s.place = s.place || {}; s.locked = s.locked || []; }
  if(a.type === 'sort'){ s.order = s.order || shuffledIdx(a.items.length); s.place = s.place || {}; s.locked = s.locked || []; }
  if(a.type === 'calc'){ s.vals = s.vals || {}; s.locked = s.locked || []; s.bad = s.bad || []; }
  if(a.type === 'table'){ if(s.filter === undefined) s.filter = null; s.sort = s.sort || null; }
  if(a.type === 'coords'){ s.vals = s.vals || {}; s.locked = s.locked || []; s.bad = s.bad || []; }
  if(a.type === 'spot'){ s.tried = s.tried || []; }
  return s;
}
const actsSolved = (l, L) => l.apply.activities.every((a,i) => L.acts[i] && L.acts[i].solved);
const checklistDone = (l, L) => l.apply.task.checklist.every((_,i) => L.checklist[i]);
function maybeApply(l, L){ if(!L.sections.apply && actsSolved(l,L) && checklistDone(l,L)){ L.sections.apply = true; toast('🎉 أنجزتِ قسم «أطبّق» كاملًا!'); } }

function orderWidget(L, key, items, locked){
  const ord = getOrder(L, key, items.length);
  return `<ol class="order-list">${ord.map((x,pos) => `<li class="order-item"><span class="num">${pos+1}</span><span class="txt">${fmt(items[x])}</span>${locked ? '' :
    `<span class="order-btns"><button class="icon-btn" data-act="orderMove" data-key="${key}" data-pos="${pos}" data-d="-1" aria-label="انقلي «${esc(plain(items[x]))}» للأعلى" ${pos===0?'disabled':''}>▲</button><button class="icon-btn" data-act="orderMove" data-key="${key}" data-pos="${pos}" data-d="1" aria-label="انقلي «${esc(plain(items[x]))}» للأسفل" ${pos===ord.length-1?'disabled':''}>▼</button></span>`}</li>`).join('')}</ol>`;
}

function viewActivity(l, L, i){
  const a = l.apply.activities[i], s = actSt(L, i, a);
  let body = '';
  if(a.type === 'match'){
    const placed = Object.values(s.place).map(Number);
    const pool = s.order.filter(x => !placed.includes(x));
    body = `<div class="pool" aria-label="البطاقات">${pool.length ? pool.map(x => `<button class="chip ${matchSel && matchSel.a===i && matchSel.x===x ? 'sel' : ''}" draggable="true" data-act="matchPick" data-a="${i}" data-x="${x}" aria-pressed="${matchSel && matchSel.a===i && matchSel.x===x}">${esc(a.pairs[x].item)}</button>`).join('') : '<span class="muted">وُضعت كل البطاقات ✓</span>'}</div>
      <div class="slots">${a.pairs.map((p,t) => { const x = s.place[t], lock = s.locked.includes(t);
        return `<div class="slot ${lock ? 'ok' : ''}" ${lock ? '' : `role="button" tabindex="0" data-act="matchPlace" data-drop="1"`} data-a="${i}" data-t="${t}" aria-label="${esc(p.target)}"><span>${esc(p.target)}</span>${x !== undefined
          ? `<span class="chip" ${lock ? '' : `role="button" tabindex="0" data-act="matchBack" data-a="${i}" data-t="${t}" aria-label="أعيدي البطاقة"`}>${esc(a.pairs[x].item)}${lock ? ' ✓' : ''}</span>` : `<span class="drop">ضعي هنا</span>`}</div>`; }).join('')}</div>
      ${s.solved ? '' : `<div class="row end" style="margin-top:1rem"><button class="btn" data-act="matchCheck" data-a="${i}">تحقّقي ✓</button></div>`}`;
  } else if(a.type === 'coords'){
    const Rg = a.range || 7, sz = 320, u = sz / (2 * (Rg + 1)), X = v => sz/2 + v*u, Y = v => sz/2 - v*u;
    let g = '';
    for(let v = -Rg; v <= Rg; v++){
      g += `<line class="gl" x1="${X(v)}" y1="${Y(-Rg)}" x2="${X(v)}" y2="${Y(Rg)}"/><line class="gl" x1="${X(-Rg)}" y1="${Y(v)}" x2="${X(Rg)}" y2="${Y(v)}"/>`;
      if(v !== 0) g += `<text class="gt" x="${X(v)}" y="${Y(0) + 10}" text-anchor="middle">${v}</text><text class="gt" x="${X(0) - 3}" y="${Y(v) + 3}" text-anchor="end">${v}</text>`;
    }
    g += `<line class="ax" x1="${X(-Rg)}" y1="${Y(0)}" x2="${X(Rg)}" y2="${Y(0)}"/><line class="ax" x1="${X(0)}" y1="${Y(-Rg)}" x2="${X(0)}" y2="${Y(Rg)}"/>
      <text class="axl" x="${X(Rg) + 4}" y="${Y(0) + 4}">x</text><text class="axl" x="${X(0) - 4}" y="${Y(Rg) - 4}" text-anchor="middle">y</text><text class="gt" x="${X(0) - 3}" y="${Y(0) + 10}" text-anchor="end">0</text>`;
    g += a.items.map(it => `<circle class="pt" cx="${X(it.x)}" cy="${Y(it.y)}" r="6"/><text class="pl" x="${X(it.x) + 8}" y="${Y(it.y) - 7}">${esc(it.name)}</text>`).join('');
    body = `<svg class="coord" viewBox="0 0 ${sz} ${sz}" dir="ltr" role="img" aria-label="مستوى إحداثيات عليه النقاط ${a.items.map(it => esc(it.name)).join('، ')}">${g}</svg>
      <div>${a.items.map((it,k) => { const ok = s.locked.includes(k), bad = s.bad.includes(k);
        return `<div class="calc-row ${ok ? 'ok' : (bad ? 'bad' : '')}"><span class="calc-q">النقطة ${esc(it.name)}</span>
          <span class="xy">( <label class="vh" for="cx-${i}-${k}">x للنقطة ${esc(it.name)}</label><input id="cx-${i}-${k}" type="text" inputmode="numeric" dir="ltr" autocomplete="off" data-calc="${k}x" data-a="${i}" value="${esc(s.vals[k + 'x'] || '')}" ${ok ? 'disabled' : ''} placeholder="x">
          , <label class="vh" for="cy-${i}-${k}">y للنقطة ${esc(it.name)}</label><input id="cy-${i}-${k}" type="text" inputmode="numeric" dir="ltr" autocomplete="off" data-calc="${k}y" data-a="${i}" value="${esc(s.vals[k + 'y'] || '')}" ${ok ? 'disabled' : ''} placeholder="y"> )</span>
          ${ok ? '<strong style="color:var(--teal-d)">✓ صحيح</strong>' : (bad ? '<span>🤔 أعيدي المحاولة</span>' : '')}</div>`; }).join('')}</div>
      ${s.solved ? '' : `<div class="row end" style="margin-top:.6rem"><button class="btn" data-act="coordsCheck" data-a="${i}">تحقّقي ✓</button></div>`}`;
  } else if(a.type === 'table'){
    const fc = a.filterCol, vals = [...new Set(a.rows.map(r => r[fc]))];
    let idx = a.rows.map((_,k) => k);
    if(s.filter !== null) idx = idx.filter(k => a.rows[k][fc] === s.filter);
    if(s.sort){ const c = s.sort.col, d = s.sort.dir === 'asc' ? 1 : -1;
      idx.sort((x,y) => d * ((a.numeric && a.numeric[c]) ? toNum(a.rows[x][c]) - toNum(a.rows[y][c]) : String(a.rows[x][c]).localeCompare(String(a.rows[y][c]), 'ar'))); }
    const on = (c,d) => s.sort && s.sort.col === c && s.sort.dir === d;
    body = `<div class="tbl-tools"><label class="lbl" for="tf-${i}">🔽 تصفية حسب «${esc(a.headers[fc])}»:</label>
        <select id="tf-${i}" data-tfilter="1" data-a="${i}" ${s.solved ? 'disabled' : ''}><option value="">(تحديد الكل)</option>${vals.map(v => `<option value="${esc(v)}" ${s.filter === v ? 'selected' : ''}>${esc(v)}</option>`).join('')}</select></div>
      <p class="muted" style="font-size:.88rem;margin:0 0 .5rem">▲ فرز تصاعدي (من أ إلى ي، ومن الأصغر) &nbsp; ▼ فرز تنازلي (من ي إلى أ، ومن الأكبر)</p>
      <div class="tbl-wrap"><table class="tbl lab"><thead><tr>${a.headers.map((h,c) => `<th scope="col"><div class="th-in"><span>${esc(h)}</span>${s.solved ? '' : `<span class="sbtns">
        <button class="icon-btn sm ${on(c,'asc') ? 'on' : ''}" data-act="tSort" data-a="${i}" data-c="${c}" data-d="asc" aria-pressed="${on(c,'asc')}" aria-label="فرز «${esc(h)}» تصاعديًا">▲</button>
        <button class="icon-btn sm ${on(c,'desc') ? 'on' : ''}" data-act="tSort" data-a="${i}" data-c="${c}" data-d="desc" aria-pressed="${on(c,'desc')}" aria-label="فرز «${esc(h)}» تنازليًا">▼</button></span>`}</div></th>`).join('')}</tr></thead>
        <tbody>${idx.map(k => `<tr>${a.rows[k].map(v => `<td>${esc(v)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
      <p class="muted" style="font-size:.9rem;margin:.4rem 0 0" aria-live="polite">يظهر ${idx.length} من ${a.rows.length} سجلات${s.filter !== null ? ' — البقية مخفية وليست محذوفة 👀' : ''}</p>
      ${s.solved ? '' : `<div class="row end" style="margin-top:.6rem"><button class="btn" data-act="tCheck" data-a="${i}">تحقّقي ✓</button></div>`}`;
  } else if(a.type === 'calc'){
    body = `<div>${a.items.map((it,k) => { const ok = s.locked.includes(k), bad = s.bad.includes(k);
      return `<div class="calc-row ${ok ? 'ok' : (bad ? 'bad' : '')}">${it.label ? `<span class="calc-q">${fmt(it.label)}</span>` : `<code class="f" dir="ltr">${esc(it.formula)}</code><span aria-hidden="true">←</span>`}
        <label class="vh" for="calc-${i}-${k}">الإجابة: ${esc(plain(it.label || it.formula))}</label>
        <input id="calc-${i}-${k}" type="text" inputmode="decimal" dir="ltr" autocomplete="off" data-calc="${k}" data-a="${i}" value="${esc(s.vals[k] || '')}" ${ok ? 'disabled' : ''} placeholder="الناتج">
        ${ok ? '<strong style="color:var(--teal-d)">✓ صحيح</strong>' : (bad ? '<span>🤔 أعيدي المحاولة</span>' : '')}</div>`; }).join('')}</div>
      ${s.solved ? '' : `<div class="row end" style="margin-top:.6rem"><button class="btn" data-act="calcCheck" data-a="${i}">تحقّقي ✓</button></div>`}`;
  } else if(a.type === 'sort'){
    const pool = s.order.filter(x => s.place[x] === undefined);
    const sel = x => matchSel && matchSel.a === i && matchSel.x === x;
    body = `<div class="pool" aria-label="البطاقات">${pool.length ? pool.map(x => `<button class="chip ${sel(x) ? 'sel' : ''}" draggable="true" data-act="matchPick" data-a="${i}" data-x="${x}" aria-pressed="${sel(x)}">${esc(a.items[x].text)}</button>`).join('') : '<span class="muted">صُنّفت كل البطاقات ✓</span>'}</div>
      <div class="buckets">${a.groups.map((g,gi) => { const inG = s.order.filter(x => s.place[x] !== undefined && Number(s.place[x]) === gi);
        return `<div class="bucket" ${s.solved ? '' : `role="button" tabindex="0" data-act="sortPlace" data-drop="1"`} data-a="${i}" data-t="${gi}" aria-label="${esc(g)}"><b>${esc(g)}</b><div class="bucket-in">${inG.length ? inG.map(x => s.locked.includes(x)
          ? `<span class="chip ok">${esc(a.items[x].text)} ✓</span>`
          : `<span class="chip" role="button" tabindex="0" data-act="sortBack" data-a="${i}" data-x="${x}" aria-label="أعيدي «${esc(a.items[x].text)}»">${esc(a.items[x].text)}</span>`).join('') : '<span class="drop">ضعي هنا</span>'}</div></div>`; }).join('')}</div>
      ${s.solved ? '' : `<div class="row end" style="margin-top:1rem"><button class="btn" data-act="sortCheck" data-a="${i}">تحقّقي ✓</button></div>`}`;
  } else if(a.type === 'spot'){
    body = `<div class="opts">${a.options.map((o,k) => { const cls = s.solved && k===a.wrongIndex ? 'right' : (s.tried.includes(k) ? 'wrong' : '');
      return `<button class="opt ${cls}" data-act="spotPick" data-a="${i}" data-k="${k}" ${s.solved || s.tried.includes(k) ? 'disabled' : ''}>${fmt(o)}</button>`; }).join('')}</div>`;
  } else if(a.type === 'order'){
    body = orderWidget(L, 'act-'+i, a.items, s.solved) + (s.solved ? '' : `<div class="row end"><button class="btn" data-act="actOrderCheck" data-a="${i}">تحقّقي ✓</button></div>`);
  }
  const fb = s.solved ? `<div class="fb ok" role="status">🎉 ${esc(a.type==='spot' ? 'أحسنتِ، اكتشفتِ الخطأ! ' + plain(a.explain) : (a.success || 'أحسنتِ! أنجزتِ النشاط.'))}</div>` : (s.fb ? `<div class="fb no" role="status">${esc(s.fb)}</div>` : '');
  return `<p class="kicker">نشاط ${i+1}</p><h3>${esc(a.title)}</h3><p>${esc(a.instruction)}</p>${body}${fb}`;
}

function secApply(l, L){
  const n = l.apply.activities.length, step = Math.min(L.applyStep || 0, n);
  const label = `<p class="substeps">الخطوة ${step+1} من ${n+1}</p>`;
  let inner;
  if(step < n) inner = viewActivity(l, L, step);
  else { const t = l.apply.task;
    inner = `<p class="kicker">مهمة عملية</p><h3>💻 ${esc(t.title)}</h3><p>${esc(t.intro)}</p>
      <ul class="checklist">${t.checklist.map((c,i) => `<li><label><input type="checkbox" data-check="${i}" ${L.checklist[i] ? 'checked' : ''}> ${fmt(c)}</label></li>`).join('')}</ul>
      ${L.sections.apply ? '<div class="fb ok">🎉 رائع! أنجزتِ الأنشطة والمهمة العملية.</div>' : (!actsSolved(l,L) ? '<div class="fb info">💡 تذكّري: يكتمل هذا القسم عند حلّ جميع الأنشطة وإنهاء المهمة.</div>' : '')}`; }
  const prev = step === 0 ? `<a class="btn secondary" href="#/lesson/${l.id}/learn">→ أتعلم</a>` : `<button class="btn secondary" data-act="applyGo" data-d="-1">→ السابق</button>`;
  const next = step < n ? `<button class="btn" data-act="applyGo" data-d="1">التالي ←</button>` : `<a class="btn" href="#/lesson/${l.id}/quiz">أختبر فهمي ←</a>`;
  return `<section class="card"><h2>🛠️ أطبّق</h2>${label}${inner}<div class="nav-row">${prev}${next}</div></section>`;
}

/* ✏️ أختبر فهمي */
function qOptions(q){ return q.type === 'tf' ? ['صح ✓','خطأ ✗'] : q.options; }
function qAnswer(q){ return q.type === 'tf' ? (q.answer ? 0 : 1) : q.answer; }
function secQuiz(l, L){
  const Q = l.quiz, qz = L.quiz;
  if(qz.finished){
    const pct = Math.round(qz.score/Q.length*100);
    return `<section class="card"><h2>✏️ أنهيتِ الاختبار!</h2>
      <div class="stats"><div class="stat teal"><b>${qz.score} / ${Q.length}</b>من المحاولة الأولى</div><div class="stat"><b>${pct}%</b>نسبتك</div></div>
      <table class="tbl"><thead><tr><th>السؤال</th><th>النتيجة</th></tr></thead><tbody>${Q.map((q,i) => { const a = qz.answers[i] || {};
        return `<tr><td>${fmt(q.q)}</td><td>${a.first ? '✓ من أول محاولة' : (a.correct ? '↻ بعد مراجعة' : '💡 رأيتِ الإجابة')}</td></tr>`; }).join('')}</tbody></table>
      <p class="muted">الدرجة تُحسب من المحاولة الأولى، ويمكنكِ إعادة الاختبار متى شئتِ.</p>
      <div class="nav-row"><button class="btn secondary" data-act="quizRestart">↻ أعيدي الاختبار</button><a class="btn" href="#/lesson/${l.id}/self">أقيّم نفسي ←</a></div></section>`;
  }
  const i = qz.idx, q = Q[i];
  const a = qz.answers[i] = qz.answers[i] || {tries:0, wrong:[], correct:false, first:false, revealed:false, value:''};
  const done = a.correct || a.revealed;
  let body;
  if(q.type === 'order'){
    body = orderWidget(L, 'q-'+i, q.items, done) + (done ? '' : `<div class="row end"><button class="btn" data-act="quizOrderCheck">تحقّقي ✓</button></div>`);
  } else {
    const ans = qAnswer(q);
    body = `<div class="opts" role="group" aria-label="الخيارات">${qOptions(q).map((o,v) => { let c = ''; if(a.wrong.includes(v)) c = 'wrong'; if(done && v === ans) c = 'right';
      return `<button class="opt ${c}" data-act="quizOpt" data-v="${v}" ${done || a.wrong.includes(v) ? 'disabled' : ''}>${fmt(o)}</button>`; }).join('')}</div>`;
  }
  let fb = '';
  const P = SETTINGS.praise, E = SETTINGS.encourage;
  if(a.correct) fb = `<div class="fb ok" role="status"><strong>${P[(i + a.tries) % P.length]}</strong> ${fmt(q.explain || '')}</div>`;
  else if(a.revealed) fb = `<div class="fb info" role="status">💡 الإجابة الصحيحة ظاهرة الآن. ${fmt(q.explain || '')}<br><a href="#/lesson/${l.id}/learn/${q.ref}">📖 راجعي: ${esc(refTitle(l,q.ref))}</a></div>`;
  else if(a.tries > 0) fb = `<div class="fb no" role="status"><strong>${E[(i + a.tries) % E.length]}</strong><br>💡 تلميح: ${fmt(q.hint)}
      <div class="row" style="margin-top:.6rem"><a class="btn secondary sm" href="#/lesson/${l.id}/learn/${q.ref}">📖 راجعي: ${esc(refTitle(l,q.ref))}</a>${a.tries >= 2 ? `<button class="btn ghost sm" data-act="quizReveal">أظهري الإجابة الصحيحة</button>` : ''}</div></div>`;
  const dots = Q.map((_,k) => { const x = qz.answers[k]; return `<span class="${k===i ? 'on' : (x && (x.correct || x.revealed) ? 'ok' : '')}"></span>`; }).join('');
  const typeLbl = {mcq:'اختيار من متعدد', tf:'صح أم خطأ؟', order:'ترتيب'}[q.type];
  return `<section class="card"><h2>✏️ أختبر فهمي</h2><div class="qdots" aria-hidden="true">${dots}</div>
    <p class="substeps">السؤال ${i+1} من ${Q.length} • ${typeLbl}</p><h3>${fmt(q.q)}</h3>${body}${fb}
    <div class="nav-row">${i > 0 ? `<button class="btn secondary" data-act="quizGo" data-d="-1">→ السابق</button>` : '<span></span>'}
    <button class="btn" data-act="quizGo" data-d="1" ${done ? '' : 'disabled'}>${i === Q.length-1 ? 'إنهاء الاختبار ✓' : 'السؤال التالي ←'}</button></div></section>`;
}

/* 🪞 أقيّم نفسي */
const RATES = [['m','أتقنتُ ✓'],['p','أحتاج تدريبًا'],['n','لم أتقن']];
const SATS = [['e','ممتاز 😄'],['g','جيد 🙂'],['i','أحتاج إلى تحسين 🌱']];
function secSelf(l, L){
  const st = L.selfStep || 0, S = L.self;
  let inner;
  if(st === 0) inner = `<h3>اختاري ما يصفكِ بصدق أمام كل عبارة:</h3>${l.self.map((s,i) => `<fieldset class="self-item"><legend>${fmt(s.text)}</legend><div class="seg">${RATES.map(([v,t]) =>
      `<label class="v-${v}"><input type="radio" name="r${i}" value="${v}" data-self="${i}" ${S.ratings[i]===v ? 'checked' : ''}><span>${t}</span></label>`).join('')}</div></fieldset>`).join('')}`;
  else if(st === 1) inner = `<h3>أتأمّل وأكتب:</h3>${SETTINGS.reflectionQuestions.map((q,i) => `<label class="lbl" for="refl${i}">${i+1}. ${esc(q)}</label><textarea id="refl${i}" data-bind="refl-${i}" placeholder="اكتبي بكلماتك…">${esc(S.reflections[i])}</textarea>`).join('')}`;
  else inner = `<h3>ما مدى رضاكِ عن تعلّمك في هذا الدرس؟</h3><fieldset class="self-item"><legend>رضاي عن تعلّمي</legend><div class="seg">${SATS.map(([v,t]) =>
      `<label class="v-${v}"><input type="radio" name="sat" value="${v}" data-sat="1" ${S.satisfaction===v ? 'checked' : ''}><span>${t}</span></label>`).join('')}</div></fieldset>`;
  const prev = st === 0 ? `<a class="btn secondary" href="#/lesson/${l.id}/quiz">→ أختبر فهمي</a>` : `<button class="btn secondary" data-act="selfGo" data-d="-1">→ السابق</button>`;
  const next = st < 2 ? `<button class="btn" data-act="selfGo" data-d="1">التالي ←</button>` : `<button class="btn success" data-act="selfSave">احفظي تقويمي وأري نتيجتي ←</button>`;
  return `<section class="card"><h2>🪞 أقيّم نفسي</h2><p class="substeps">الجزء ${st+1} من 3</p>${inner}<div class="nav-row">${prev}${next}</div></section>`;
}

/* 🏅 نتيجتي */
function computeResult(l, L){
  const Q = l.quiz, qz = L.quiz, pct = Math.round(qz.score/Q.length*100);
  const r = l.self.map((_,i) => L.self.ratings[i]); const m = r.filter(x => x==='m').length;
  const combined = pct*0.7 + (m/l.self.length*100)*0.3;
  const level = combined >= 85 ? 'excellent' : (combined >= 60 ? 'good' : 'review');
  const refs = new Set();
  Q.forEach((q,i) => { const a = qz.answers[i]; if(!a || !a.first) refs.add(q.ref); });
  l.self.forEach((s,i) => { if(r[i] !== 'm') refs.add(s.ref); });
  return {pct, m, p:r.filter(x => x==='p').length, n:r.filter(x => x==='n').length, level, refs:[...refs]};
}
function secResult(l, L){
  if(!L.sections.quiz || !L.sections.self){
    return `<section class="card"><h2>🏅 نتيجتي</h2><div class="fb info">تظهر نتيجتك بعد إكمال هذين القسمين:</div><ul class="goals">
      ${!L.sections.quiz ? `<li><a href="#/lesson/${l.id}/quiz">✏️ أختبر فهمي</a></li>` : ''}${!L.sections.self ? `<li><a href="#/lesson/${l.id}/self">🪞 أقيّم نفسي</a></li>` : ''}</ul></section>`;
  }
  if(!L.sections.result){ L.sections.result = true; L.completedAt = Date.now(); save(); setTimeout(() => toast('🎉 أكملتِ الدرس! أحسنتِ'), 300); }
  const R = computeResult(l, L), msg = SETTINGS.resultMessages[R.level].replace('{name}', nm());
  const recs = R.level === 'excellent' || R.refs.length === 0
    ? `<li>أنتِ جاهزة! <a href="#/lesson/${l.id}/challenge">⭐ انتقلي إلى تحدي الدرس</a></li>`
    : R.refs.map(ref => `<li>راجعي الجزء: <a href="#/lesson/${l.id}/learn/${ref}">${esc(refTitle(l,ref))}</a></li>`).join('') + `<li>ثم <a href="#/lesson/${l.id}/quiz">أعيدي الاختبار</a> لتري تقدّمك.</li>`;
  const sat = (SATS.find(s => s[0] === L.self.satisfaction) || ['',''])[1];
  return `<section class="card"><h2>🏅 نتيجتي</h2>
    <p class="muted">${esc(state.name || 'الطالبة')} • ${esc(l.title)} • ${todayStr()}</p>
    <div class="fb ok" style="font-size:1.08rem"><strong>${esc(msg)}</strong></div>
    <div class="stats"><div class="stat teal"><b>${R.pct}%</b>درجة الاختبار</div><div class="stat"><b>${R.m} / ${l.self.length}</b>عبارات أتقنتها</div>
      <div class="stat"><b>${R.p + R.n}</b>أحتاج تدريبًا عليها</div><div class="stat teal"><b style="font-size:1.2rem;padding:.35rem 0">${sat}</b>رضاي عن تعلّمي</div></div>
    ${sendStatus('lesson:' + l.id)}${!state.name && formCfg() && !formCfg().error ? '<div class="fb no">✍️ لم تكتبي اسمك بعد! اكتبيه في <a href="#/">الصفحة الرئيسية</a> لتعرف معلمتك أن هذه نتيجتك.</div>' : ''}
    <h3>توصيتي:</h3><ul class="recs">${recs}</ul>
    <div class="row" style="margin-top:1rem"><button class="btn success" data-act="printResult">🖨️ طباعة / حفظ PDF لبطاقة النتيجة</button>
      <a class="btn secondary" href="#/lesson/${l.id}/challenge">⭐ تحدي المتميزات</a><a class="btn ghost" href="#/">🏠 الرئيسية</a></div>
    <p class="muted" style="font-size:.85rem;margin-top:.6rem">لحفظها PDF: اختاري «حفظ بتنسيق PDF» في نافذة الطباعة، ثم سلّميها لمعلمتك.</p></section>`;
}

/* ⭐ تحدي المتميزات */
function secChallenge(l, L){

    ${L.challenge.done ? '<div class="fb ok">🎨 أنجزتِ التحدي! أنتِ مبدعة رقمية.</div>' : `<div class="row end" style="margin-top:1rem"><button class="btn success" data-act="challengeDone">✓ أنجزتُ التحدي</button></div>`}

  const cert = all ? `<div class="cert-preview"><p class="kicker">شهادة إنجاز</p><h2>تشهد منصة «${esc(SETTINGS.siteTitle)}» بأن الطالبة</h2>
      <p style="font-size:1.6rem;font-weight:800;color:var(--teal-d)">${esc(state.name || '..................')}</p><p>أكملت جميع دروس ${esc(SETTINGS.subject)} بتعلّم ذاتي مستقل.</p></div>

  return `<section class="card"><h1>🏅 إنجازاتي</h1><p>${state.name ? `أحسنتِ يا ${esc(state.name)}، هذه رحلتكِ في التعلّم.` : 'هنا تظهر دروسك المكتملة وشاراتك.'}</p></section>

    <section class="card"><h2>شاراتي (${state.badges.length} من ${badges.length})</h2><div class="badges">${bs}</div></section>

/* 📨 قسم استقبال النتائج في دليل المعلمة */
let linkDraft = '';
function linkResultHtml(){
  if(!linkDraft.trim()) return '';
  const c = formCfg(linkDraft);
  if(!c) return '';

/* ==================== التوجيه والعرض ==================== */
function render(keepScroll){
  Game.stop();
  const y = window.scrollY;
  const parts = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean).map(decodeURIComponent);
  let page = parts[0] || 'home', html;
  if(page === 'lesson'){
    const l = getLesson(parts[1]);
    if(!l || l.comingSoon){ location.hash = '#/'; return; }
    html = viewLesson(l, parts[2], parts[3]);
  } else if(page === 'unit'){
    const u = getUnit(parts[1]); if(!u || !u.assessment){ location.hash = '#/units'; return; }
    html = viewUnit(u);
  } else if(page === 'units') html = viewUnits();
  else if(page === 'adventure') html = viewAdventure();
  else if(page === 'play'){ const L = parseInt(parts[1], 10); if(isNaN(L) || !advUnlocked(L)){ location.hash = '#/adventure'; return; } html = viewPlay(L); }
  else if(page === 'achievements') html = viewAchievements();
  else if(page === 'teacher') html = viewTeacher();
  else { page = 'home'; html = viewHome(); }
  $('#main').innerHTML = html;
  const navPage = page === 'unit' ? 'units' : page === 'play' ? 'adventure' : page;
  document.querySelectorAll('.main-nav a').forEach(a => { if(a.dataset.page === navPage) a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current'); });
  $('#hello').textContent = state.name ? `مرحبًا يا ${state.name} 🌷` : '';
  if(page === 'play'){ Game.start(parseInt(parts[1], 10)); const gw = document.getElementById('advWrap'), tb = document.querySelector('.topbar');
    const stick = tb && getComputedStyle(tb).position === 'sticky' ? tb.offsetHeight : 0;
    if(gw) window.scrollTo(0, Math.max(0, gw.getBoundingClientRect().top + window.scrollY - stick - 6)); return; }
  if(keepScroll){ window.scrollTo(0, y); return; }
  const ref = page === 'lesson' && parts[2] === 'learn' && parts[3] ? document.getElementById('ref-' + parts[3]) : null;
  if(ref){ ref.classList.add('flash'); setTimeout(() => ref.scrollIntoView({behavior:'smooth', block:'center'}), 60); }
  else { window.scrollTo(0, 0); $('#main').focus({preventScroll:true}); }
}
const rerender = () => render(true);
function go(hash){ if(location.hash === hash) render(); else location.hash = hash; }

// ---- المؤثرات الصوتية واللحن (مؤلَّفة بالكامل داخل المتصفح) ----
const Sfx = (() => {
  let ac = null, on = true, music = false, mt = 0, mi = 0;
  function ctx(){ if(!ac){ try{ ac = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ return null; } }
    if(ac && ac.state === 'suspended') ac.resume(); return ac; }
  function tone(f, d, type = 'square', v = .07, f2 = null, delay = 0){
    if(!on) return; const a = ctx(); if(!a) return;
    const t = a.currentTime + delay, o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t); if(f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
    o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + d + .03);
  }
  const fx = {
    jump:   () => tone(330, .16, 'square', .045, 660),
    coin:   () => { tone(880, .07, 'triangle', .08); tone(1175, .18, 'triangle', .08, null, .06); },
    stomp:  () => tone(240, .14, 'square', .07, 70),
    hurt:   () => tone(440, .32, 'sawtooth', .05, 110),
    bump:   () => tone(150, .09, 'square', .06, 110),
    correct:() => [523, 659, 784, 1047].forEach((f,i) => tone(f, .15, 'triangle', .08, null, i*.08)),
    wrong:  () => tone(247, .25, 'triangle', .06, 200),
    key:    () => [1047, 1319, 1568, 2093].forEach((f,i) => tone(f, .14, 'sine', .07, null, i*.06)),
    check:  () => [659, 880].forEach((f,i) => tone(f, .14, 'triangle', .07, null, i*.09)),
    win:    () => [523, 659, 784, 659, 784, 1047].forEach((f,i) => tone(f, .2, 'square', .045, null, i*.13)),
    lose:   () => [392, 330, 262].forEach((f,i) => tone(f, .28, 'triangle', .07, null, i*.22)),
    locked: () => tone(196, .16, 'square', .05, 175),
    door:   () => [392, 523, 659, 784].forEach((f,i) => tone(f, .16, 'sine', .07, null, i*.07)),
    star:   () => [1319, 1760, 2349].forEach((f,i) => tone(f, .12, 'triangle', .07, null, i*.05)),
    evolve: () => [523, 784, 1047, 1568, 2093].forEach((f,i) => tone(f, .16, 'sine', .08, null, i*.07))
  };
  // لحن خلفية قصير أصلي (يُكرَّر)
  const MEL = [[523,1],[659,1],[784,1],[880,1],[784,2],[659,1],[587,1],[523,1],[587,1],[659,2],[523,2],
               [440,1],[523,1],[587,1],[659,1],[587,2],[523,1],[494,1],[440,1],[494,1],[523,4]];
  function tick(){
    if(!music || !on) return; const a = ctx(); if(!a) return;
    if(mt < a.currentTime) mt = a.currentTime + .05;
    while(mt < a.currentTime + .35){
      const [f, len] = MEL[mi % MEL.length], d = len * .17, o = a.createOscillator(), g = a.createGain();
      o.type = 'triangle'; o.frequency.value = f / 2;
      g.gain.setValueAtTime(.03, mt); g.gain.exponentialRampToValueAtTime(.0001, mt + d);
      o.connect(g); g.connect(a.destination); o.start(mt); o.stop(mt + d + .03);
      if(mi % 4 === 0){ const b = a.createOscillator(), bg = a.createGain(); b.type = 'square'; b.frequency.value = f / 4;
        bg.gain.setValueAtTime(.012, mt); bg.gain.exponentialRampToValueAtTime(.0001, mt + .3); b.connect(bg); bg.connect(a.destination); b.start(mt); b.stop(mt + .33); }
      mt += d + .02; mi++;
    }
  }
  return { play: n => { try{ fx[n] && fx[n](); }catch(e){} }, setOn: v => { on = v; }, isOn: () => on,
           setMusic: v => { music = v; mt = 0; }, musicOn: () => music, tick, unlock: ctx };
})();

  { sky:['#6EC3F5','#DFF4FF'], grass:'#4FBF63', grassD:'#36994A', dirt:'#B77846', dot:'#9C6236', brick:'#E9813F', brickL:'#B95E25', decor:'cubes', hud:'#1F5F8B' },
  { sky:['#9BE6C6','#F0FFF8'], grass:'#23985F', grassD:'#18774A', dirt:'#7B5A3B', dot:'#664A30', brick:'#3FA88F', brickL:'#2A8069', decor:'grid',  hud:'#18774A' },
  { sky:['#232861','#6253C2'], grass:'#A99CFF', grassD:'#7D6CF0', dirt:'#3A3466', dot:'#2E2953', brick:'#7A6CF0', brickL:'#5446C2', decor:'stars', hud:'#3A3466' },
  { sky:['#131838','#43307E'], grass:'#FFAB19', grassD:'#D98A00', dirt:'#6B4A2A', dot:'#57391F', brick:'#FF8C1A', brickL:'#C96A0C', decor:'space', hud:'#43307E' }
