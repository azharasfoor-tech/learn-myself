// ---- قطع المراحل (١٠ صفوف) — . فراغ  # أرض  = طوب  ? صندوق المعرفة  o عملة  e حشرة  ^ أشواك  c نقطة حفظ  D بوابة  P البداية ----
const CH = (...rows) => rows;
const G2 = w => ['#'.repeat(w), '#'.repeat(w)];
const E8 = w => Array(8).fill('.'.repeat(w));
const mk = (w, over, ground) => { const r = E8(w).map((row,i) => over[i] !== undefined ? over[i] : row); return r.concat(ground || G2(w)); };
const CHUNKS = {
  start:    mk(6, {7:'.P....'}),
  flat:     mk(6, {}),
  coins:    mk(6, {5:'.ooo..'}),
  q:        mk(6, {5:'..?...'}),
  q_high:   mk(8, {2:'....?...', 6:'...===..'}),
  gap2:     mk(7, {5:'..oo...'}, ['##..###','##..###']),
  gap3:     mk(8, {5:'..ooo...'}, ['##...###','##...###']),
  stairs:   mk(8, {2:'....*...', 4:'....o...', 5:'....=...', 6:'...==...', 7:'..===...'}),
  shelves:  mk(12, {1:'.......*....', 3:'......===...', 4:'.....*......', 5:'..===.......', 7:'...ooo......'}),
  shelves2: mk(14, {1:'..*...........', 2:'.===.....*....', 4:'.....===......', 5:'..........===.', 6:'.....o........', 7:'..o.......o...'}),
  enemy:    mk(9, {7:'.....e...'}),
  enemy2:   mk(12, {7:'..e.....e...'}),
  spikes:   mk(8, {4:'..oo....', 5:'.====...', 7:'..^^....'}),
  spikes3:  mk(9, {4:'..ooo....', 5:'.=====...', 7:'..^^^....'}),
  island:   mk(10, {3:'....*.....', 5:'....oo....', 6:'....==....'}, ['##......##','##......##']),
  plat_en:  mk(12, {4:'....e.......', 5:'...======...', 7:'.........e..'}),
  pit_sp:   mk(10, {5:'.....o....', 6:'....===...'}, ['###....###','###....###']),
  ledge:    mk(8, {5:'..ooo...', 6:'..====..'}),
  ledge_hi: mk(10, {3:'......*...', 4:'.....===..', 6:'.===......'}),
  bridge:   mk(10, {4:'....**....', 5:'.===..===.'}),
  cp:       mk(6, {7:'..c...'}),
  door:     mk(8, {0:'.......#',1:'.......#',2:'.......#',3:'.......#',4:'.......#',5:'.......#',6:'.......#',7:'....D..#'})
};
const CH_POOLS = [
  ['ledge','ledge_hi','bridge','coins','gap2','stairs','enemy','spikes','shelves'],
  ['gap3','enemy2','spikes3','island','shelves','shelves2','ledge_hi','bridge'],
  ['plat_en','pit_sp','enemy2','island','gap3']
];
const BRICK_PAL = [{m:'#FF7A59',d:'#B9482A'},{m:'#FFC23D',d:'#B9850E'},{m:'#4FB3F0',d:'#23729F'},{m:'#9C6BFF',d:'#6237C2'},{m:'#3FCB7F',d:'#20874F'},{m:'#FF6FB5',d:'#B93A7A'}];
function mulberry32(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

const CHAR_IMGS = {};
function charId(info){ const ids = Object.keys(CHARACTER_ART || {}); const want = adventure.worldCharacter && adventure.worldCharacter[info.u.id]; return CHARACTER_ART[want] ? want : (ids[0] || null); }
function charName(id){ return (adventure.characters && adventure.characters[id]) || 'البطلة'; }
function charFrames(id){
  if(!id || !CHARACTER_ART[id]) return null;
  if(!CHAR_IMGS[id]){ CHAR_IMGS[id] = {}; const A = CHARACTER_ART[id];
    if(A.kind === 'blob') CHAR_IMGS[id].colors = A.colors.map(c => { const im = new Image(); im.src = c.uri; return im; });
    else ['stand','walk','jump'].forEach(k => { const a = A[k]; if(a){ const im = new Image(); im.src = a.uri; CHAR_IMGS[id][k] = im; } }); }
  return CHAR_IMGS[id];
}
function charThumb(id){ const A = CHARACTER_ART[id]; return A ? (A.kind === 'blob' ? A.colors[0].uri : A.stand.uri) : ''; }
function charHit(id){ const A = CHARACTER_ART[id]; return (A && A.hit) || {w:20, h:40}; }
function advState(){ state.adv = state.adv || {done:{}, sound:true, music:false}; state.adv.done = state.adv.done || {}; return state.adv; }
const advCount = () => units.length * 3;
function advUnlocked(L){ return L >= 0 && L < advCount() && (adventure.openAll || L === 0 || !!advState().done[L-1]); }
function advInfo(L){
  const w = Math.floor(L / 3), s = L % 3, u = units[w];
  return { L, w, s, u, world: (adventure.worlds && adventure.worlds[u.id]) || u.name,
    stage: (adventure.stages && adventure.stages[s]) || ('المرحلة ' + (s+1)),
    need: (adventure.keysNeeded && adventure.keysNeeded[s]) || 3, d: L, theme: ADV_THEMES[w % ADV_THEMES.length], char: null };
}
// أسئلة المغامرة: بلا تكرار داخل المرحلة، والأسئلة التي لم تظهر للطالبة من قبل تأتي أولًا
const qKey = t => plain(t).replace(/[\sً-ْ«»"'.,،:؟?!()]/g, '').toLowerCase();
function advQuestions(info){
  const ul = lessons.filter(l => l.unit === info.u.id && !l.comingSoon), half = Math.ceil(ul.length / 2);
  const src = info.s === 0 ? ul.slice(0, half) : info.s === 1 ? ul.slice(half).concat(ul.length < 2 ? ul : []) : ul;
  const conv = (q, fromAssess) => q.type === 'tf'
    ? {q:q.q, options:['صح ✓','خطأ ✗'], answer:q.answer ? 0 : 1, hint:(fromAssess ? q.explain : (q.hint || q.explain)) || 'راجعي دروس الوحدة.'}
    : {q:q.q, options:q.options, answer:q.answer, hint:(fromAssess ? q.explain : (q.hint || q.explain)) || 'راجعي دروس الوحدة.'};
  const primary = [], extra = [], seenText = new Set();
  const add = (arr, q, fa) => { if(q.type !== 'mcq' && q.type !== 'tf') return; const k = qKey(q.q); if(seenText.has(k)) return; seenText.add(k); arr.push(conv(q, fa)); };
  src.forEach(l => (l.quiz || []).forEach(q => add(primary, q, false)));
  if(info.s === 2 && info.u.assessment) unitQs(info.u).forEach(q => add(primary, q, true));
  ul.filter(l => !src.includes(l)).forEach(l => (l.quiz || []).forEach(q => add(extra, q, false)));
  if(info.s !== 2 && info.u.assessment) unitQs(info.u).forEach(q => add(extra, q, true));
  const asked = new Set(advState().seen || []), shuf = a => { for(let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i+1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const fresh = x => !asked.has(qKey(x.q));
  const out = [...shuf(primary.filter(fresh)), ...shuf(extra.filter(fresh)), ...shuf(primary.filter(x => !fresh(x))), ...shuf(extra.filter(x => !fresh(x)))];
  return out.length ? out : [{q:'هل أنتِ مستعدة للمغامرة؟', options:['نعم! 🚀','بالتأكيد ✨'], answer:0, hint:''}];
}
function markSeen(q){ const A = advState(); A.seen = A.seen || []; const k = qKey(q.q); if(!A.seen.includes(k)){ A.seen.push(k); if(A.seen.length > 400) A.seen.shift(); } }
function buildLevel(L){
  const info = advInfo(L), rng = mulberry32(L * 7919 + 31), pick = a => a[Math.floor(rng() * a.length)];
  const tier = info.d < 3 ? 0 : info.d < 7 ? 1 : 2;
  const pool = CH_POOLS.slice(0, tier + 1).flat(), qPool = tier >= 1 ? ['q','q_high'] : ['q'];
  const qCount = info.need + 2, fillers = 6 + Math.round(info.d * 1.1), total = fillers + qCount;
  // تبدأ كل مرحلة برف ملوّن ظاهر، ثم رف كل قطعتين تقريبًا
  const shelfPool = tier >= 1 ? ['ledge','ledge_hi','bridge','shelves','shelves2'] : ['ledge','ledge_hi','bridge','shelves'];
  // حشرة في بداية كل مرحلة، ثم حشرات بانتظام (تزيد مع الصعوبة)
  const enemyPool = tier >= 1 ? ['enemy','enemy2'] : ['enemy'];
  // أشواك وحفر بالتناوب مع الحشرات
  const hazardPool = tier === 0 ? ['spikes','spikes','gap2','coins'] : tier === 1 ? ['spikes','spikes3','gap3','gap2'] : ['spikes3','pit_sp','gap3','spikes','island'];
  const seq = ['start', 'ledge', 'enemy']; let placed = 0;
  for(let i = 0; i < total; i++){
    if(Math.floor((i + 1) * qCount / total) > placed){ seq.push(pick(qPool)); placed++; }
    else if(i % 2 === 0) seq.push(pick(shelfPool));
    else if(i % 4 === 1) seq.push(pick(enemyPool));
    else seq.push(pick(hazardPool));
    if(i === Math.floor(total / 2)) seq.push('cp');
  }
  seq.push('door');
  const rows = Array.from({length:10}, () => '');
  seq.forEach(n => CHUNKS[n].forEach((r,i) => { rows[i] += r; }));
  return { rows, info };
}

// ---- محرك اللعبة ----
const Game = (() => {
  const TS = 32, VW = 512, VH = 320, ROWS = 10, SPRITE_H = 58; let PH = 40;
  let cv, cx, wrap, raf = 0, running = false, paused = true, modal = false, ended = false;
  let grid, W, info, P, enemies, parts, floats, cam = 0, frame = 0, acc = 0, last = 0, qs, qi;
  let keysIn = {}, touch = {l:0, r:0, j:0, f:0}, prevJump = false, jumpBuf = 0, coyote = 0, lockMsg = 0, shake = 0;
  let stats, respawn, cps, bumps;

  const $g = id => document.getElementById(id);
  // الأرض والصناديق صلبة من كل الجهات، أما أرفف الطوب (=) فتُعبَر من الأسفل والجانب ويُوقف عليها من الأعلى
  const solid = (tx, ty) => { if(tx < 0 || tx >= W) return true; if(ty < 0 || ty >= ROWS) return false; const c = grid[ty][tx]; return c === '#' || c === '?' || c === 'Q'; };
  const isShelf = (tx, ty) => ty >= 0 && ty < ROWS && tx >= 0 && tx < W && grid[ty][tx] === '=';
  const tileAt = (tx, ty) => (ty >= 0 && ty < ROWS && tx >= 0 && tx < W) ? grid[ty][tx] : '.';
  const setTile = (tx, ty, c) => { grid[ty][tx] = c; };
  const hit = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;

  function load(L){
    const lv = buildLevel(L); info = lv.info; info.char = charId(info); charFrames(info.char); W = lv.rows[0].length; PH = charHit(info.char).h;
    grid = lv.rows.map(r => r.split('')); enemies = []; parts = []; floats = []; cps = []; bumps = {};
    stats = { coins:0, bonus:0, stars:0, starTotal:0, tier:0, coinTotal:0, keys:0, answered:0, firstTry:0, lives:(adventure.lives || 3), lost:0 };
    const espd = Math.min(.7 + info.d * .1, 1.9);
    for(let y = 0; y < ROWS; y++) for(let x = 0; x < W; x++){
      const c = grid[y][x];
      if(c === 'P'){ respawn = {x:x*TS + 6, y:(y+1)*TS - PH}; grid[y][x] = '.'; }
      else if(c === 'e'){ enemies.push({x:x*TS + 3, y:(y+1)*TS - 22, w:26, h:22, vx:0, vy:0, dir:-1, spd:espd, alive:true, sq:0, onGround:false}); grid[y][x] = '.'; }
      else if(c === 'o') stats.coinTotal++;
      else if(c === '*') stats.starTotal++;
      else if(c === 'c'){ cps.push({x:x*TS, y:(y+1)*TS - PH, tx:x, ty:y, on:false}); }
    }
    P = { x:respawn.x, y:respawn.y, w:charHit(info.char).w, h:PH, land:0, vx:0, vy:0, face:1, onGround:false, inv:0, walk:0 };
    qs = advQuestions(info); qi = 0; cam = 0; ended = false; modal = false;
    hud();
  }

  // ---- الحركة والتصادم ----
  function moveX(o){
    o.x += o.vx; o.hitWall = 0;
    const top = Math.floor(o.y / TS), bot = Math.floor((o.y + o.h - 1) / TS);
    if(o.vx > 0){ const tx = Math.floor((o.x + o.w) / TS); for(let ty = top; ty <= bot; ty++) if(solid(tx, ty)){ o.x = tx*TS - o.w - .01; o.vx = 0; o.hitWall = 1; break; } }
    else if(o.vx < 0){ const tx = Math.floor(o.x / TS); for(let ty = top; ty <= bot; ty++) if(solid(tx, ty)){ o.x = (tx+1)*TS + .01; o.vx = 0; o.hitWall = -1; break; } }
  }
  function moveY(o, onHead){
    o.y += o.vy; o.onGround = false;
    const l = Math.floor(o.x / TS), r = Math.floor((o.x + o.w - 1) / TS), mid = Math.floor((o.x + o.w/2) / TS);
    const order = [mid, l, r].filter((v,i,a) => a.indexOf(v) === i && v >= l && v <= r);
    if(o.vy > 0){ const ty = Math.floor((o.y + o.h) / TS), wasAbove = (o.y + o.h - o.vy) <= ty*TS + .5; for(const tx of order) if(solid(tx, ty) || (wasAbove && isShelf(tx, ty))){ o.y = ty*TS - o.h; o.vy = 0; o.onGround = true; break; } }
    else if(o.vy < 0){ const ty = Math.floor(o.y / TS); for(const tx of order) if(solid(tx, ty)){ o.y = (ty+1)*TS; o.vy = 0; if(onHead) onHead(tx, ty); break; } }
  }

  function update(){
    frame++;
    if(P.inv > 0) P.inv--; if(lockMsg > 0) lockMsg--; if(shake > 0) shake--;
    // الإدخال
    const jf = touch.f;   // زر «قفزة للأمام»: يقفز ويتقدم في اتجاه البطلة بضغطة واحدة
    const left = keysIn.ArrowLeft || keysIn.a || keysIn.A || touch.l || (jf && P.face < 0), right = keysIn.ArrowRight || keysIn.d || keysIn.D || touch.r || (jf && P.face > 0);
    const jump = keysIn[' '] || keysIn.ArrowUp || keysIn.w || keysIn.W || touch.j || jf;
    if(jump && !prevJump) jumpBuf = 7; prevJump = jump; if(jumpBuf > 0) jumpBuf--;
    const accel = P.onGround ? .8 : .45, max = 3.6;
    if(left && !right){ P.vx = Math.max(P.vx - accel, -max); P.face = -1; }
    else if(right && !left){ P.vx = Math.min(P.vx + accel, max); P.face = 1; }
    else P.vx *= P.onGround ? .72 : .995;
    if(Math.abs(P.vx) < .05) P.vx = 0;
    if(P.onGround) coyote = 7; else if(coyote > 0) coyote--;
    if(jumpBuf > 0 && coyote > 0){ P.vy = -12; if(jf && Math.abs(P.vx) < 3.3) P.vx = P.face * 3.3; else if(Math.abs(P.vx) > .5) P.vx = Math.sign(P.vx) * Math.max(Math.abs(P.vx), 3.3); jumpBuf = 0; coyote = 0; Sfx.play('jump'); puff(P.x + P.w/2, P.y + P.h, '#ffffff', 4); }
    if(!jump && P.vy < -8.5) P.vy = -8.5;
    P.vy = Math.min(P.vy + .55, 12);
    const wasGround = P.onGround;
    moveX(P); moveY(P, (tx, ty) => { Sfx.play('bump'); bumps[tx+','+ty] = 8; if(tileAt(tx, ty) === '?') askQuestion(tx, ty); });
    if(P.onGround && !wasGround) P.land = 9; if(P.land > 0) P.land--;
    if(P.onGround && Math.abs(P.vx) > .3) P.walk += Math.abs(P.vx) * .12;
    // العملات والأشواك
    const l = Math.floor(P.x / TS), r = Math.floor((P.x + P.w - 1) / TS), t = Math.floor(P.y / TS), b = Math.floor((P.y + P.h - 1) / TS);
    for(let ty = t; ty <= b; ty++) for(let tx = l; tx <= r; tx++){
      const c = tileAt(tx, ty);
      if(c === 'o'){ setTile(tx, ty, '.'); stats.coins++; Sfx.play('coin'); sparkle(tx*TS + 16, ty*TS + 16, '#FFD54A'); floatText('+1', tx*TS + 16, ty*TS, '#FFE27A'); hud(); }
      if(c === '*'){ setTile(tx, ty, '.'); stats.stars++; Sfx.play('star'); sparkle(tx*TS + 16, ty*TS + 16, '#FFF07A'); sparkle(tx*TS + 16, ty*TS + 16, '#FFB3E6'); floatText('🌟 +' + (adventure.starPoints || 5), tx*TS + 16, ty*TS, '#FFF07A'); hud(); }
      if(c === '^' && hit(P, {x:tx*TS + 7, y:ty*TS + 20, w:18, h:12})) hurt('spike');
      if(c === 'D') atDoor(tx, ty);
    }
    checkTier();
    // نقاط الحفظ
    cps.forEach(c => { if(!c.on && P.x > c.x){ c.on = true; respawn = {x:c.x + 4, y:c.y}; Sfx.play('check'); floatText('✔ نقطة حفظ', c.x + 16, c.y - 10, '#B8FFC8'); } });
    // الأعداء
    enemies.forEach(e => {
      if(!e.alive){ if(e.sq > 0) e.sq--; return; }
      if(Math.abs(e.x - P.x) > VW * 1.2) return;
      e.vx = e.dir * e.spd; e.vy = Math.min(e.vy + .55, 10); moveX(e); moveY(e);
      if(e.hitWall) e.dir *= -1;
      else if(e.onGround){ const ax = e.dir > 0 ? Math.floor((e.x + e.w + 1) / TS) : Math.floor((e.x - 1) / TS), ay = Math.floor((e.y + e.h + 2) / TS); if(!solid(ax, ay) && !isShelf(ax, ay)) e.dir *= -1; }
      if(hit({x:P.x + 3, y:P.y + 4, w:P.w - 6, h:P.h - 4}, {x:e.x + 3, y:e.y + 4, w:e.w - 6, h:e.h - 4})){
        if(P.vy > 0 && (P.y + P.h - P.vy) <= e.y + 12){ e.alive = false; e.sq = 26; P.vy = -7.5; Sfx.play('stomp'); puff(e.x + e.w/2, e.y + e.h/2, '#E7DBFF', 8); floatText('🐞 تم الإصلاح!', e.x + 13, e.y - 6, '#FFFFFF'); }
        else hurt('enemy', e);
      }
    });
    if(P.y > ROWS * TS + 40) hurt('pit');
    // الكاميرا
    const target = Math.max(0, Math.min(P.x - VW * .4, W * TS - VW));
    cam += (target - cam) * .15;
    // الجسيمات
    parts.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += p.g; p.life--; }); parts = parts.filter(p => p.life > 0);
    floats.forEach(f => { f.y -= .6; f.life--; }); floats = floats.filter(f => f.life > 0);
    Object.keys(bumps).forEach(k => { if(--bumps[k] <= 0) delete bumps[k]; });
    Sfx.tick();
  }

  function points(){ return stats.coins + stats.bonus + stats.stars * (adventure.starPoints || 5); }
  function checkTier(){
    const A = CHARACTER_ART[info.char]; if(!A || A.kind !== 'blob') return;
    const steps = adventure.colorSteps || [0, 10, 22, 36], pts = points();
    let t = 0; steps.forEach((v,i) => { if(pts >= v && i < A.colors.length) t = i; });
    if(t > stats.tier){ stats.tier = t; Sfx.play('evolve'); P.land = 12;
      for(let i = 0; i < 3; i++) sparkle(P.x + P.w/2, P.y + P.h/2, ['#FFFFFF','#FFE27A','#B9F3FF'][i]);
      floatText('✨ ' + charName(info.char) + ' صار ' + ((adventure.colorNames || [])[t] || 'بلون جديد') + '!', P.x + P.w/2, P.y - 18, '#FFFFFF'); hud(); }
  }
  function hurt(why, e){
    if(ended) return;
    if(why !== 'pit' && P.inv > 0) return;
    stats.lives--; stats.lost++; Sfx.play('hurt'); shake = 14; hud();
    if(stats.lives <= 0){ gameOver(); return; }
    if(why === 'pit'){ P.x = respawn.x; P.y = respawn.y; P.vx = P.vy = 0; P.inv = 90; cam = Math.max(0, Math.min(P.x - VW*.4, W*TS - VW)); floatText('حاولي مجددًا 💪', P.x + 10, P.y - 10, '#FFFFFF'); }
    else { P.inv = 90; P.vy = -6; P.vx = e ? (P.x < e.x ? -4 : 4) : -P.face * 4; }
  }
  function atDoor(){
    if(ended) return;
    if(stats.keys >= info.need){ win(); return; }
    if(lockMsg === 0){ Sfx.play('locked'); floatText(`🔒 تحتاجين ${info.need - stats.keys} 🔑 أخرى`, P.x + 10, P.y - 14, '#FFE27A'); lockMsg = 90; }
  }

  // ---- صندوق المعرفة (سؤال) ----
  function askQuestion(tx, ty){
    if(modal || ended) return;
    const q = qs[qi % qs.length]; qi++; markSeen(q);
    modal = true; let tries = 0;
    const box = $g('advQ');
    box.innerHTML = `<div class="game-card" role="dialog" aria-modal="true" aria-labelledby="advQt">
      <p class="kicker">📦 صندوق المعرفة • ${esc(info.world)}</p><h3 id="advQt">${fmt(q.q)}</h3>
      <div class="opts">${q.options.map((o,i) => `<button class="opt" data-qo="${i}"><b>${i+1}</b> ${fmt(o)}</button>`).join('')}</div>
      <div id="advQfb" aria-live="polite"></div></div>`;
    box.hidden = false;

    parts.forEach(p => { cx.globalAlpha = Math.min(1, p.life / 20); cx.fillStyle = p.color; cx.fillRect(p.x - cam, p.y, p.r, p.r); }); cx.globalAlpha = 1;
    cx.textAlign = 'center'; cx.textBaseline = 'middle'; cx.font = 'bold 13px Tajawal, Arial';
    floats.forEach(f => { cx.globalAlpha = Math.min(1, f.life / 25); cx.lineWidth = 3; cx.strokeStyle = 'rgba(0,0,0,.55)'; cx.strokeText(f.t, f.x - cam, f.y); cx.fillStyle = f.color; cx.fillText(f.t, f.x - cam, f.y); }); cx.globalAlpha = 1;
    // شريط التقدم في المرحلة
    cx.fillStyle = 'rgba(0,0,0,.25)'; rr(VW/2 - 80, 6, 160, 6, 3); cx.fill(); cx.fillStyle = '#FFD54A'; rr(VW/2 - 80, 6, 160 * Math.min(1, P.x / (W*TS - 64)), 6, 3); cx.fill();
    cx.restore();
  }
  function hud(){
    const h = $g('advHud'); if(!h || !stats) return;
    const k = Math.min(stats.keys, info.need);
    h.innerHTML = `<span title="الأرواح">${'❤️'.repeat(Math.max(stats.lives, 0))}${'🤍'.repeat(Math.max(0, (adventure.lives || 3) - Math.max(stats.lives, 0)))}</span>
      <span title="العملات">🪙 ${stats.coins + stats.bonus}</span><span title="النجوم">🌟 ${stats.stars}${stats.starTotal ? '/' + stats.starTotal : ''}</span><span title="النقاط">✨ ${points()}</span>
      <span title="قطع المفتاح" class="${k >= info.need ? 'keys-full' : ''}">🔑 ${k} / ${info.need}</span>`;
  }

  // ---- الحلقة الرئيسية ----
  function loop(ts){
    if(!running) return;
    raf = requestAnimationFrame(loop);
    if(!last) last = ts;
    let dt = Math.min(ts - last, 100); last = ts;
    if(!paused && !modal && !ended){ acc += dt; while(acc >= 1000/60){ update(); acc -= 1000/60; } }
    else { acc = 0; frame++; Sfx.tick(); }
    draw();
  }
  function onKey(e){
    if(!running) return;
    const tag = (e.target.tagName || '').toLowerCase();
    if(modal){ if(e.type === 'keydown' && /^[1-4]$/.test(e.key)){ const b = document.querySelector(`#advQ [data-qo="${+e.key - 1}"]`); if(b) b.click(); } return; }
    if(tag === 'input' || tag === 'textarea') return;
    if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(e.key) && !paused) e.preventDefault();
    if(e.type === 'keydown'){ keysIn[e.key] = true; if((e.key === 'p' || e.key === 'P' || e.key === 'Escape') && !ended) togglePause(); }
    else keysIn[e.key] = false;
  }
  function togglePause(force){
    if(ended || modal) return;
    paused = force !== undefined ? force : !paused;
    const b = $g('advPause'); if(b) b.textContent = paused ? '▶ متابعة' : '⏸ إيقاف';
    if(paused && $g('advOv').hidden) overlay(`<div class="game-card center"><h2>⏸ استراحة قصيرة</h2><p>المغامرة بانتظارك!</p>
      <div class="row" style="justify-content:center"><button class="btn success" data-gact="resume">▶ متابعة</button><button class="btn secondary" data-gact="restart">↻ إعادة المرحلة</button><a class="btn ghost" href="#/adventure">🗺️ الخريطة</a></div></div>`);
    else if(!paused) hideOverlay();
  }
  function onVis(){ if(document.hidden && running && !paused && !ended && !modal) togglePause(true); }
  function bindTouch(){
    document.querySelectorAll('[data-tk]').forEach(b => {
      const k = b.dataset.tk;
      const dn = ev => { ev.preventDefault(); Sfx.unlock(); touch[k] = 1; b.classList.add('down'); try{ b.setPointerCapture(ev.pointerId); }catch(e){} };
      const up = ev => { ev.preventDefault(); touch[k] = 0; b.classList.remove('down'); };
      b.addEventListener('pointerdown', dn); b.addEventListener('pointerup', up); b.addEventListener('pointercancel', up); b.addEventListener('lostpointercapture', up);
      b.addEventListener('contextmenu', ev => ev.preventDefault());
    });
  }
  function onClick(e){
    const g = e.target.closest('[data-gact]'); if(!g) return;
    const a = g.dataset.gact; Sfx.unlock();
    if(a === 'go' || a === 'resume'){ hideOverlay(); paused = false; last = 0; const b = $g('advPause'); if(b) b.textContent = '⏸ إيقاف'; cv.focus(); }
    else if(a === 'restart'){ hideOverlay(); load(info.L); paused = false; last = 0; const b = $g('advPause'); if(b) b.textContent = '⏸ إيقاف'; cv.focus(); }
    else if(a === 'pause') togglePause();
    else if(a === 'sound'){ const A = advState(); A.sound = !Sfx.isOn(); Sfx.setOn(A.sound); save(); g.textContent = A.sound ? '🔊' : '🔇'; g.setAttribute('aria-pressed', A.sound); if(A.sound) Sfx.play('coin'); }
    else if(a === 'music'){ const A = advState(); A.music = !Sfx.musicOn(); Sfx.setMusic(A.music); save(); g.classList.toggle('on', A.music); g.setAttribute('aria-pressed', A.music); }
    else if(a === 'full'){ const w = $g('advWrap'); try{ if(document.fullscreenElement) document.exitFullscreen(); else if(w.requestFullscreen) w.requestFullscreen(); }catch(err){} }
  }

  function start(L){
    stop();
    wrap = $g('advWrap'); cv = $g('advCanvas'); if(!cv) return;
    const dpr = Math.min(window.devicePixelRatio || 1, 2); cv.width = VW * dpr; cv.height = VH * dpr;
    cx = cv.getContext('2d'); cx.setTransform(dpr, 0, 0, dpr, 0, 0); cx.imageSmoothingEnabled = true;
    const A = advState(); Sfx.setOn(A.sound !== false); Sfx.setMusic(!!A.music);
    load(L); running = true; paused = true; last = 0; acc = 0; keysIn = {}; touch = {l:0, r:0, j:0, f:0};
    window.addEventListener('keydown', onKey); window.addEventListener('keyup', onKey);
    document.addEventListener('visibilitychange', onVis); wrap.addEventListener('click', onClick);
    bindTouch(); intro(); raf = requestAnimationFrame(loop);
  }
  function stop(){
    if(!running) return; running = false; cancelAnimationFrame(raf); Sfx.setMusic(false);
    window.removeEventListener('keydown', onKey); window.removeEventListener('keyup', onKey);
    document.removeEventListener('visibilitychange', onVis); if(wrap) wrap.removeEventListener('click', onClick);
    try{ if(document.fullscreenElement) document.exitFullscreen(); }catch(e){}
  }
  return { start, stop, _dbg: () => ({P, stats, info, enemies, W, grid, get modal(){ return modal; }, get ended(){ return ended; }, get paused(){ return paused; }}), _update: () => update(), _win: () => win() };
})();

// ---- صفحة خريطة المغامرة ----
function viewAdventure(){
  const A = advState(), n = advCount(), done = Object.keys(A.done).length, stars = Object.values(A.done).reduce((s,d) => s + (d.stars || 0), 0);
  const worlds = units.map((u, w) => {
    const th = ADV_THEMES[w % ADV_THEMES.length];
    const nodes = [0,1,2].map(s => {
      const L = w*3 + s, inf = advInfo(L), d = A.done[L], open = advUnlocked(L);
      const cls = d ? 'done' : open ? 'open' : 'locked';
      const inner = d ? '✓' : open ? (s + 1) : '🔒';
      return `<div class="adv-node-wrap"><a class="adv-node ${cls}" href="${open ? '#/play/' + L : '#/adventure'}" ${open ? '' : 'data-locked="1" aria-disabled="true"'} aria-label="${esc(inf.stage)}${d ? ' — مكتملة' : open ? ' — مفتوحة' : ' — مقفلة'}">${inner}</a>
        <span class="adv-node-name">${esc(inf.stage)}</span>
        <span class="adv-node-stars" aria-hidden="true">${d ? '⭐'.repeat(d.stars) + '☆'.repeat(3 - d.stars) : `🔑×${inf.need}`}</span></div>`;
    }).join('<span class="adv-path" aria-hidden="true"></span>');
    return `<section class="adv-world" style="--w1:${th.sky[0]};--w2:${th.sky[1]};--wg:${th.grass}">
      <div class="adv-world-head"><span class="ic" aria-hidden="true">${u.icon}</span><div style="flex:1"><p>${esc(u.number)}: ${esc(u.name)}</p><h2>${esc((adventure.worlds && adventure.worlds[u.id]) || u.name)}</h2></div>
        ${(() => { const id = charId({u}); return id ? `<span class="adv-hero-chip"><img src="${charThumb(id)}" alt="">${esc(charName(id))}</span>` : ''; })()}</div>
      <div class="adv-nodes">${nodes}</div></section>`;
  }).join('');
  return `<section class="adv-hero"><div><p class="adv-tag">🎮 لعبة تعليمية</p><h1>${esc(adventure.title || 'بوابة المغامرة')}</h1>
      <p>رحلة عبر ${units.length} عوالم و${n} مراحل من الأسهل إلى الأصعب. اقفزي، اجمعي العملات، أجيبي عن صناديق المعرفة لتجمعي المفاتيح 🔑، وافتحي بوابة كل مرحلة!</p>
      <div class="adv-meta"><span>🏁 ${done} / ${n} مراحل</span><span>⭐ ${stars} / ${n * 3} نجوم</span></div></div>
      <div class="adv-hero-art" aria-hidden="true">🧭</div></section>
    <div class="fb info">💡 الأسئلة في كل عالم من دروس وحدته، فتعلّمي الدروس أولًا لتصبح المغامرة أسهل!</div>
    ${worlds}`;
}
function viewPlay(L){
  const inf = advInfo(L), A = advState();
  return `<section class="card" style="padding:.8rem">
    <div class="row spread" style="margin-bottom:.5rem"><div><p class="kicker" style="margin:0">${esc(inf.u.number)} • ${esc(inf.world)}</p><h1 style="margin:0;font-size:1.3rem">المرحلة ${inf.s + 1}: ${esc(inf.stage)}</h1></div>
      <a class="btn ghost sm" href="#/adventure">🗺️ الخريطة</a></div>
    <div id="advWrap" class="game-wrap">
      <div class="game-top" dir="rtl"><div id="advHud" class="game-hud" aria-live="polite"></div>
        <div class="game-tools"><button class="icon-btn" data-gact="sound" aria-label="الصوت" aria-pressed="${A.sound !== false}">${A.sound !== false ? '🔊' : '🔇'}</button>
          <button class="icon-btn ${A.music ? 'on' : ''}" data-gact="music" aria-label="الموسيقى" aria-pressed="${!!A.music}">🎵</button>
          <button class="icon-btn" data-gact="full" aria-label="ملء الشاشة">⛶</button>
          <button class="btn secondary sm" id="advPause" data-gact="pause">⏸ إيقاف</button></div></div>
      <canvas id="advCanvas" tabindex="0" role="img" aria-label="لعبة منصّات: البطلة تجري وتقفز وتجمع المفاتيح من صناديق المعرفة"></canvas>
      <div class="game-pad" dir="ltr">
        <div class="pad-move"><button class="pad-btn" data-tk="l" aria-label="يسار">◀</button><button class="pad-btn" data-tk="r" aria-label="يمين">▶</button></div>
        <div class="pad-move"><button class="pad-btn fwd" data-tk="f" aria-label="قفزة للأمام">↗ للأمام</button><button class="pad-btn jump" data-tk="j" aria-label="قفز">⤒ قفز</button></div></div>
      <div id="advOv" class="game-ov" hidden></div>
      <div id="advQ" class="game-ov" hidden></div>
    </div></section>`;
}

/* بدء التشغيل */
$('#brandTitle').textContent = SETTINGS.siteTitle;
$('#copyText').textContent = SETTINGS.copyright || '';
$('#brandSub').textContent = SETTINGS.subject;
window.addEventListener('hashchange', () => { matchSel = null; render(); });
window.addEventListener('online', flushOutbox);
setTimeout(flushOutbox, 1500);
render();
</script>
